<!doctype html>
<!-- Ruta: imperio/index-imperio.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Imperio</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .barra { padding: 6px 12px; flex: none; }
    .datos { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-weight: 700; }
    #dinero { color: #ffd23f; }
    #oleada, #pobl, #botin { color: var(--suave); font-weight: 400; font-size: .85rem; }
    #zona { position: relative; flex: 1; min-height: 0; }
    #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #aviso { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: #000b; padding: 6px 12px; border-radius: 999px; font-size: .85rem; pointer-events: none; }
    .zoom { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
    #inferior { flex: none; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--tarjeta); border-top: 1px solid var(--borde); }
    #inv { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .ranura { min-width: 62px; min-height: 1.7em; padding: 3px 6px; font-size: .72rem; color: var(--suave); border: 1px dashed var(--borde); border-radius: 6px; }
    .ranura.llena { color: var(--texto); background: var(--fondo); border-style: solid; }
    #seleccion { font-size: .85rem; color: var(--suave); margin-bottom: 6px; min-height: 1.2em; }
    #acciones { display: flex; flex-wrap: wrap; gap: 6px; }
    #acciones .btn { padding: 6px 10px; font-size: .82rem; }
    #bReino { position: absolute; top: 8px; left: 8px; z-index: 3; }
    #reino { position: absolute; top: 50px; left: 8px; z-index: 3; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 64px); overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #1b2036ee; border: 1px solid var(--borde); border-radius: 12px; font-size: .85rem; }
    #reino .resumen { font-weight: 700; } #reino p { margin: 0; color: var(--suave); }
    .soldado { padding: 8px 10px; font: inherit; font-size: .82rem; text-align: left; color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; cursor: pointer; }
    .soldado.activo { border-color: var(--acento); }
    #menu { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; background: radial-gradient(circle at 50% 30%, #25304a, #0b0e18); }
    #menu > div { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(420px, 100%); text-align: center; }
    #menu h1 { font-size: 2.4rem; margin: 0 0 12px; } #menu h2 { margin: 0; }
    .grande { width: 100%; padding: 16px; font-size: 1.1rem; }
    .sec { background: #2c3350; }
    .nueva { display: flex; gap: 8px; width: 100%; } .nueva input { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; }
    #partidas { width: 100%; display: flex; flex-direction: column; gap: 8px; color: var(--suave); }
    .fila { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; text-align: left; color: var(--texto); }
    .fila span { flex: 1; min-width: 0; display: flex; flex-direction: column; } .fila small { color: var(--suave); }
    #fin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #000c; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header class="barra">
    <a class="volver" href="../index.html">← Juegos</a>
    <div class="datos" id="datos" hidden><span id="dinero">$0</span><span id="pobl"></span><span id="botin"></span></div>
    <button class="btn" id="bMenu" hidden>Guardar y salir</button>
  </header>
  <div id="zona">
    <canvas id="lienzo"></canvas>
    <div id="aviso" hidden></div>
    <button class="btn" id="bReino" hidden>👑 Reino</button>
    <div id="reino" hidden></div>
    <div class="zoom"><button class="btn" id="zmas" aria-label="Acercar">+</button><button class="btn" id="zmenos" aria-label="Alejar">−</button></div>
    <div id="menu">
      <div id="mPrincipal"><h1>🏛️ Imperio</h1><button class="btn grande" id="bPers">Partida personalizada</button><button class="btn grande" id="bNiv">Niveles</button></div>
      <div id="mPers" hidden><h2>Partida personalizada</h2>
        <div class="nueva"><input id="nombre" maxlength="24" placeholder="Nombre de la partida" /><button class="btn" id="crear">Crear partida</button></div>
        <div id="partidas"></div><button class="btn sec" id="vPers">Volver</button></div>
      <div id="mNiv" hidden><h2>Niveles</h2><p>Aquí irán los niveles con distintas temáticas. Por ahora no hay ninguno.</p><button class="btn sec" id="vNiv">Volver</button></div>
    </div>
    <div id="fin" hidden><h2>Fin de la partida</h2><p id="finTxt"></p><button class="btn" id="otra">Empezar de nuevo</button></div>
  </div>
  <div id="inferior"><div id="inv"></div><div id="seleccion"></div><div id="acciones"></div></div>
  <script type="module" src="juego-imperio.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
