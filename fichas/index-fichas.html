<!doctype html>
<!-- Ruta: fichas/index-fichas.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Fichas de frutas</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: radial-gradient(ellipse at 50% 30%, #23252b, #101114 70%); }

    /* Juego vertical (400×720): se deja libre una franja arriba para los botones flotantes */
    .inmersivo .escena { padding-top: calc(54px + env(safe-area-inset-top, 0px)); }
    .inmersivo .marco { aspect-ratio: 400 / 720;
      width: min(100vw, calc((100vh - 54px) * 400 / 720));
      width: min(100vw, calc((100dvh - 54px - env(safe-area-inset-top, 0px)) * 400 / 720)); }
    .inmersivo .lienzo { user-select: none; -webkit-user-select: none; touch-action: none; }

    #poderes { position: absolute; left: 0; right: 0; bottom: calc(14 * var(--u, 1px)); display: flex; justify-content: center; gap: calc(22 * var(--u, 1px)); pointer-events: none; }
    #poderes .b3d { --t: clamp(44px, calc(60 * var(--u, 1px)), 72px); pointer-events: auto; }

    /* Ventanas (menú de niveles y fin de nivel) */
    .velo { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(10,10,12,.86); padding: 12px; }
    .caja { width: min(92vw, 460px); max-height: 92vh; max-height: 92dvh; overflow: auto; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 20px; padding: 18px; text-align: center; color: #fff; box-shadow: 0 6px 0 #0c0d0f, 0 14px 24px rgba(0,0,0,.5); }
    .caja h2 { margin: 0 0 8px; }
    .caja p { margin: 6px 0; color: var(--suave); }
    #mBot, .acciones-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
    .niveles { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 4px 6px; margin-top: 14px; }
    .niveles .b3d { --t: 44px; width: 100%; font-size: 14px; font-weight: 800; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal" title="Volver al portal"><span class="b-ico">🏠</span></a>
    <button class="b3d chico b-azul" id="btnMenu" type="button" aria-label="Niveles" title="Niveles"><span class="b-ico">☰</span></button>
    <span class="chip" id="nivelTxt">Nivel 1</span>
  </div>
  <div class="hud hud-der">
    <button class="b3d chico b-gris" id="btnSon" type="button" aria-label="Sonido" title="Sonido">🔊</button>
  </div>

  <div class="escena" id="escena">
    <div class="marco" id="marco">
      <canvas id="lienzo" class="lienzo"></canvas>
      <div id="poderes">
        <button class="b3d b-azul" id="pwDeshacer" type="button" aria-label="Deshacer" title="Deshacer"><span class="b-ico">↩️</span><span class="b-info">2</span></button>
        <button class="b3d b-morado" id="pwVarita" type="button" aria-label="Varita mágica" title="Varita mágica: quita un trío"><span class="b-ico">🪄</span><span class="b-info">2</span></button>
        <button class="b3d b-oro" id="pwMezclar" type="button" aria-label="Mezclar" title="Mezclar las fichas"><span class="b-ico">🔀</span><span class="b-info">2</span></button>
      </div>
    </div>
  </div>

  <div class="velo" id="modal" hidden>
    <div class="caja">
      <h2 id="mTit"></h2>
      <p id="mTxt"></p>
      <div id="mBot"></div>
    </div>
  </div>

  <div class="velo" id="menu">
    <div class="caja">
      <h2>🍓 Fichas de frutas</h2>
      <p>Toca las fichas que no tengan otra encima y junta 3 iguales en la bandeja. Si se llenan los 7 espacios, pierdes.</p>
      <div class="acciones-menu">
        <button class="b3d txt grande b-verde" id="continuar" type="button">▶ Jugar</button>
        <button class="b3d txt grande b-azul" id="seguir" type="button" hidden>Seguir jugando</button>
      </div>
      <div class="niveles" id="niveles"></div>
    </div>
  </div>

  <script type="module" src="juego-fichas.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
