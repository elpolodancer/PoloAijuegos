<!doctype html>
<!-- Ruta: sudoku/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sudoku</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    :root { --s-borde: #3a4658; --s-fondo: #222c3b; --s-sel: #2f6fed55; --s-rel: #ffffff10; --s-ok: #6ee7a8; --s-mal: #ff6b6b; }
    .zona { max-width: 460px; margin: 0 auto; padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 10px; }
    .fila { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .fila select { padding: 6px 8px; border-radius: 8px; background: var(--s-fondo); color: inherit; border: 1px solid var(--s-borde); }
    #datos { font-size: .85rem; opacity: .85; display: flex; gap: 12px; }
    #tablero { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; aspect-ratio: 1; border: 2px solid #9fb0c8; border-radius: 6px; overflow: hidden; background: var(--s-fondo); user-select: none; touch-action: manipulation; }
    .cel { position: relative; border: 1px solid var(--s-borde); background: transparent; color: #cfe0ff; font: inherit; font-size: clamp(1.1rem, 5.5vw, 1.7rem); padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cel.dado { color: #fff; font-weight: 700; }
    .cel.c3 { border-right: 2px solid #9fb0c8; }
    .cel.f3 { border-bottom: 2px solid #9fb0c8; }
    .cel.rel { background: var(--s-rel); }
    .cel.igual { background: #ffd16655; }
    .cel.sel { background: var(--s-sel); outline: 2px solid #5b9bff; outline-offset: -2px; z-index: 1; }
    .cel.mal { color: var(--s-mal); }
    .notas { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; font-size: clamp(.45rem, 2.2vw, .7rem); color: #9fb0c8; line-height: 1; }
    .notas span { display: flex; align-items: center; justify-content: center; }
    #teclado { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
    #teclado button, .herr button { padding: 10px 0; font-size: 1.2rem; border-radius: 8px; border: 1px solid var(--s-borde); background: var(--s-fondo); color: inherit; cursor: pointer; }
    #teclado button:disabled { opacity: .25; }
    .herr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .herr button { font-size: .85rem; padding: 9px 2px; }
    .herr button.on { background: #2f6fed; border-color: #5b9bff; }
    #msg { min-height: 1.4em; text-align: center; font-weight: 700; color: var(--s-ok); }
  </style>
</head>
<body>
  <header class="barra">
    <div class="titulo">
      <a class="btn" href="../">←</a>
      <h1>🔢 Sudoku</h1>
    </div>
  </header>
  <main class="zona">
    <div class="fila">
      <select id="dificultad" aria-label="Dificultad">
        <option value="facil">Fácil</option>
        <option value="medio" selected>Medio</option>
        <option value="dificil">Difícil</option>
      </select>
      <button class="btn" id="nuevo">Nueva partida</button>
    </div>
    <div id="datos"><span id="tiempo">00:00</span><span id="errores">Errores: 0</span><span id="mejor"></span></div>
    <div id="tablero"></div>
    <div id="msg"></div>
    <div id="teclado"></div>
    <div class="herr">
      <button id="lapiz">✏️ Notas</button>
      <button id="borrar">⌫ Borrar</button>
      <button id="deshacer">↩ Deshacer</button>
      <button id="pista">💡 Pista</button>
    </div>
  </main>
  <script type="module" src="juego.js"></script>
</body>
</html>
