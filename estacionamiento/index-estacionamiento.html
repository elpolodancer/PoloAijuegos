<!doctype html>
<!-- Ruta: estacionamiento/index-estacionamiento.html -->
<!-- Inicio con mapa (ESTANDARES-juegos.md, sección 13): pantalla de inicio (Modo libre · Jugar · Mapa · Ajustes), mapa de un solo país como menú principal,
     barra de nivel arriba al centro, tres cuadros de datos y Modo libre con partidas guardadas. Los estilos del estándar viven en compartido/inmersivo.css (bloque «INICIO CON MAPA»). -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Estacionamiento</title>
  <meta name="theme-color" content="#d9a866" />
  <!-- Evita el parpadeo de la madera clara al abrir en modo oscuro -->
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    /* El fondo (madera clara u oscura) lo pone compartido/fondo-madera.js; este color solo se ve un instante antes de que cargue */
    html.inmersivo { --fondo-juego: #d9a866; }
    html.inmersivo.oscura { --fondo-juego: #1d2024; }
    body.inmersivo { background: transparent; }
    .b3d:disabled { filter: grayscale(.85) brightness(.7); }

    /* El estacionamiento ocupa toda la pantalla; los botones flotan encima. El lienzo es TRANSPARENTE para que se vea la madera: el JS limpia con clearRect.
       Solo se ve dentro de una partida (el JS pone/quita «hidden»). El tablero se encuadra en la zona que dejan libre la barra de arriba, los cuadros de datos y los boosts (zonaTablero en el JS). */
    #escena { position: fixed; inset: 0; z-index: 1; }
    #lienzo { display: block; width: 100%; height: 100%; background: transparent; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }

    /* Cuadro de corazones: late cuando quedan 3 o menos */
    #vidas.poco b { animation: latido .8s ease-in-out infinite; }
    @keyframes latido { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { #vidas.poco b { animation: none; } }

    /* Boosts abajo al centro (⛶ va abajo a la derecha) */
    .hud-abajo { left: 50%; transform: translateX(-50%); gap: 8px; z-index: 6; }

    #msg { position: fixed; z-index: 6; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: 92vw; padding: 6px 14px; text-align: center; color: #f1f2f4; background: rgba(10,10,12,.82); border: 1px solid var(--borde); border-radius: 16px; font-size: .9rem; pointer-events: none; opacity: 0; transition: opacity .2s; }
    #msg.ver { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #msg { transition: none; } }

    /* La sesión puede tener un nombre largo: se recorta con «…» para no tapar el chip de monedas */
    #sesion { display: inline-block; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 30px; }
    #sesion:empty { display: none; }

    /* Pantalla de inicio y Modo libre: usan .pant-menu de compartido/inmersivo.css */
    #pantalla-libre { gap: 10px; }
    #pantalla-libre h2 { margin: 0; font-size: 1.4rem; }
    .libre-jugar .b3d > span { position: relative; }

    /* Ventana «Partidas guardadas» (usa .pausa-fondo y .pausa-panel de compartido/inmersivo.css) */
    .pausa-panel.pg-panel { width: min(100%, 420px); }
    .pg-nota { margin: 0 0 10px; color: #b0b4bd; font-size: .85rem; line-height: 1.3; }
    .pg-lista { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .pg-fila { display: flex; gap: 8px; align-items: flex-start; }
    .pausa-panel .pg-main { --t: 54px; flex: 1 1 auto; min-width: 0; justify-content: flex-start; height: auto; min-height: var(--t); padding: 6px 12px; white-space: normal; text-align: left; line-height: 1.2; font-size: 15px; border-radius: 15px; }
    .pg-main > span { position: relative; }
    .pg-main .b-ico { margin-right: 8px; }
    .pg-main .pg-texto { display: flex; flex-direction: column; align-items: flex-start; }
    .pg-main .pg-texto small { font-size: .75rem; font-weight: 600; opacity: .9; }
    .pausa-panel .pg-borrar { --t: 54px; flex: none; height: var(--t); padding: 0 12px; font-size: 15px; border-radius: 15px; }
    .pg-borrar > span { position: relative; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto data-madera-boton="oculto"> <!-- oculto: sin el botón 🌙/☀️ flotante (el cambio de madera está en ⚙️ Ajustes) -->
  <!-- Navegación estándar 13.3: 🎮 y ☰ cuadrados, solo icono. ☰ se oculta en la pantalla de inicio y en la vista principal del mapa -->
  <nav class="nav-juego cuadrada" aria-label="Navegación">
    <a class="b3d chico b-azuloscuro" id="btn-portal" href="../" title="Juegos: volver al portal" aria-label="Juegos: volver al portal"><span class="b-ico">🎮</span></a>
    <button class="b3d chico b-verdeclaro" id="btn-menu" type="button" title="Volver al menú principal" aria-label="Volver al menú principal" hidden><span class="b-ico">☰</span></button>
  </nav>
  <!-- Arriba a la derecha, en columna: sesión y, debajo, monedas (dentro de una partida las monedas pasan a la barra de nivel) -->
  <div class="hud hud-der columna"><span class="chip" id="sesion"></span><span class="chip chip-monedas" id="monedas" title="Monedas: 20 por nivel medio y 35 por nivel difícil, solo la primera vez"></span></div>

  <!-- Dentro de una partida: monedas · 🗺️ · botón verde con el nombre del nivel (al tocarlo pregunta «¿Salir?») -->
  <div class="barra-nivel" id="barra-nivel" hidden>
    <button class="b3d b-azul btn-mapa" id="btn-mapa-juego" type="button" title="Mapa" aria-label="Mapa"><span class="b-ico">🗺️</span></button>
    <button class="b3d txt b-verde nombre" id="barra-juego" type="button" title="Salir al mapa"><span id="nombre-nivel"></span></button>
  </div>
  <!-- Tres cuadros azules, cada uno más oscuro que el anterior -->
  <div class="cuadros-datos" id="cuadros" hidden>
    <div>Movimientos<b id="movs">0</b></div>
    <div id="vidas" title="Corazones: pierdes uno al tocar un auto que tiene otro enfrente">Corazones ❤️<b id="vidas-txt">0</b></div>
    <div>Autos<b id="autos-txt">0</b></div>
  </div>

  <main id="escena" hidden>
    <canvas id="lienzo" class="lienzo"></canvas>
  </main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="hud hud-abajo" id="boosts" hidden></div>

  <!-- Pantalla de inicio (13.2): se ve UNA sola vez, al abrir el juego. Modo libre · Jugar (el doble de alto) · Mapa · Ajustes -->
  <div class="pant-menu" id="pantalla-inicio" hidden>
    <div class="ini-menu">
      <button class="b3d txt b-morado ini-libre" id="btn-inicio-libre" type="button"><span class="b-ico">♾️</span><span>Modo libre</span></button>
      <button class="b3d txt b-verde ini-jugar" id="btn-inicio-jugar" type="button"><span class="b-ico">▶</span><span>Jugar</span></button>
      <button class="b3d txt b-azul ini-mapa" id="btn-inicio-mapa" type="button"><span class="b-ico">🗺️</span><span>Mapa</span></button>
      <button class="b3d txt b-cielo ini-ajustes" id="btn-inicio-ajustes" type="button"><span class="b-ico">⚙️</span><span>Ajustes</span></button>
    </div>
  </div>

  <!-- Modo libre (13.7): dificultad (😐 medio · 😡 difícil), tablero (5×5 a 10×10), récord y partidas guardadas. No da monedas ni puntos -->
  <div class="pant-menu" id="pantalla-libre" hidden>
    <h2>♾️ Modo libre</h2>
    <p class="modo-grupo">Dificultad</p>
    <div class="modo-fila dif-fila" id="dif-fila" role="group" aria-label="Dificultad"></div>
    <p class="dif-nombre" id="dif-nombre"></p>
    <p class="modo-grupo">Tablero</p>
    <div class="modo-fila" id="tam-fila" role="group" aria-label="Tamaño del tablero"></div>
    <p class="libre-nota" id="nota-libre"></p>
    <p class="libre-record" id="libre-record"></p>
    <div class="libre-jugar">
      <button class="b3d txt grande b-verde" id="btn-libre-jugar" type="button"><span class="b-ico">▶</span> Jugar</button>
      <button class="b3d txt grande b-azul" id="btn-libre-guardadas" type="button"><span class="b-ico">💾</span> <span>Partidas guardadas <span id="cuenta-guardadas"></span></span></button>
    </div>
  </div>

  <!-- Fin de nivel: estándar «sobre el tablero» (.sobre-tablero en compartido/inmersivo.css); juego-estacionamiento.js lo coloca encima del tablero -->
  <div id="victoria" class="sobre-tablero" hidden>
    <div class="sobre-texto">
      <h2 id="vtitulo">¡Nivel completado!</h2>
      <div id="vtexto"></div>
    </div>
    <button class="b3d txt grande b-verde" id="siguiente" type="button">Siguiente nivel ▶</button>
    <div class="sobre-fila">
      <button class="b3d txt b-cielo" id="repetir" type="button">Repetir nivel</button>
      <button class="b3d txt b-azul" id="al-mapa" type="button"><span class="b-ico">🗺️</span> <span id="al-mapa-txt">Mapa</span></button>
    </div>
  </div>

  <!-- Sin corazones: también va «sobre el tablero» -->
  <div id="derrota" class="sobre-tablero" hidden>
    <div class="sobre-texto">
      <h2>¡Sin corazones! 💔</h2>
      <div id="dtexto">Tocaste autos que tenían otro enfrente.</div>
    </div>
    <button class="b3d txt grande b-rojo" id="d-vida" type="button"></button>
    <div class="sobre-fila">
      <button class="b3d txt b-cielo" id="d-repetir" type="button">Reintentar nivel</button>
      <button class="b3d txt b-azul" id="d-mapa" type="button"><span class="b-ico">🗺️</span> <span id="d-mapa-txt">Mapa</span></button>
    </div>
  </div>

  <script type="module" src="juego-estacionamiento.js"></script>
  <!-- El menú de pausa, el mapa, Ajustes y la lista de partidas los crea juego-estacionamiento.js -->
  <script type="module" src="../compartido/pantalla-completa.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
</body>
</html>
