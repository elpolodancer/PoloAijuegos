<!doctype html>
<!-- Ruta: estacionamiento/index-estacionamiento.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Estacionamiento</title>
  <meta name="theme-color" content="#15161a" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #1b1d21; }
    .b3d:disabled { filter: grayscale(.85) brightness(.7); }

    /* El estacionamiento ocupa toda la pantalla (se mueve con el dedo y se acerca con pellizco); los botones flotan encima */
    #escena { position: absolute; inset: 0; }
    #lienzo { display: block; width: 100%; height: 100%; background: #1b1d21; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .hud-der { flex-direction: column; align-items: flex-end; gap: 6px; }
    .hud-abajo { gap: 8px; }
    .chip small { margin-right: 5px; }

    #msg { position: fixed; z-index: 6; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: 92vw; padding: 6px 14px; background: rgba(10,10,12,.82); border: 1px solid var(--borde); border-radius: 999px; font-size: .9rem; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
    #msg.ver { opacity: 1; }
    /* Ayuda que se desvanece sola a los pocos segundos */
    .ayuda { position: fixed; z-index: 4; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(92vw, 420px); margin: 0; padding: 6px 12px; text-align: center; font-size: .78rem; color: #d8dbe2;
      background: rgba(10,10,12,.7); border-radius: 12px; pointer-events: none; animation: desvanece .8s 9s forwards; }
    @keyframes desvanece { to { opacity: 0; visibility: hidden; } }

    #victoria { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; background: rgba(10,10,12,.82); }
    #victoria h2 { margin: 0; font-size: 1.6rem; }
    @media (prefers-reduced-motion: reduce) { #msg { transition: none; } }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <main id="escena">
    <canvas id="lienzo" class="lienzo"></canvas>
  </main>
  <div id="msg" role="status" aria-live="polite"></div>
  <p class="ayuda">Toca un auto para sacarlo hacia donde apunta su flecha. Arrastra para mover la vista y pellizca (o usa la rueda) para acercar.</p>

  <!-- Capas flotantes -->
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal" title="Volver al portal"><span class="b-ico">🏠</span></a>
    <span class="chip"><small>Autos</small><b id="autos">0</b></span>
    <span class="chip"><small>Movs</small><b id="movs">0</b></span>
  </div>
  <div class="hud hud-der">
    <button class="b3d chico b-rojo" id="reiniciar" type="button" title="Reiniciar nivel" aria-label="Reiniciar nivel"><span class="b-ico">🔄</span></button>
    <button class="b3d chico b-azul" id="mas" type="button" title="Acercar" aria-label="Acercar"><span class="b-ico">➕</span></button>
    <button class="b3d chico b-azul" id="menos" type="button" title="Alejar" aria-label="Alejar"><span class="b-ico">➖</span></button>
    <button class="b3d chico b-oro" id="centrar" type="button" title="Centrar la vista" aria-label="Centrar la vista"><span class="b-ico">🎯</span></button>
  </div>
  <div class="hud hud-abajo">
    <div id="niveles" style="display:flex;gap:8px" role="group" aria-label="Nivel"></div>
  </div>

  <div id="victoria" hidden>
    <h2 id="vtitulo">¡Nivel completado!</h2>
    <div id="vtexto"></div>
    <button class="b3d txt b-verde" id="siguiente" type="button">Siguiente nivel ▶</button>
    <button class="b3d txt b-gris" id="repetir" type="button">Repetir nivel</button>
  </div>
  <script type="module" src="juego-estacionamiento.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
