<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ladrillos numerados</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    main { padding: 8px 12px; }
    .hud { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--suave); }
    .hud b { color: var(--texto); }
    #lienzo { background: #0b0e1a; aspect-ratio: 9 / 16; width: min(100%, calc((100dvh - 130px) * 0.5625)); max-width: 420px; height: auto; margin: 8px auto; }
  </style>
</head>
<body>
  <header class="barra">
    <a class="volver" href="../">← Juegos</a>
    <h1>🧱 Ladrillos numerados</h1>
    <div>Puntos: <b id="puntos">0</b></div>
  </header>
  <main>
    <div class="hud">
      <span>Pelotas: <b id="pelotas">1</b></span>
      <span>Velocidad: <b id="vel">×1.0</b></span>
      <span>Nivel: <b id="nivel">1</b></span>
    </div>
    <canvas id="lienzo" class="lienzo" width="360" height="640"></canvas>
  </main>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
