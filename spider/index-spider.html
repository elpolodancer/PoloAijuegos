<!DOCTYPE html>
<html lang="es" class="inmersivo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9a866">
<title>Spider</title>
<script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
<link rel="stylesheet" href="../compartido/estilos.css">
<link rel="stylesheet" href="../compartido/inmersivo.css">
<style>
.pantalla { position: fixed; inset: 0; }
.pantalla[hidden] { display: none; }
/* Menú principal */
#menu { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 16px; overflow-y: auto; text-align: center; color: var(--txt-fondo); }
#menu h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); text-shadow: var(--sombra-txt); }
#menu p { margin: 0; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); }
.fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
#menu .b3d.txt { --t: 48px; }
.principales .b3d.txt { --t: 58px; font-size: 18px; min-width: 210px; }
#aviso { min-height: 1.3em; font-weight: 700; }
/* Mesa */
/* Tablero = fila superior + mesa de columnas. La fila superior NO tiene fondo: son cartas como las de la partida, con los mismos límites
   que las columnas (series terminadas desde el borde izquierdo de la 1.ª columna; el mazo, carta boca abajo, sobre la última columna).
   Su alto y las medidas las ajusta juego-spider.js (medidas). */
#tablero { position: absolute; left: 6px; right: 6px; top: 100px; bottom: 68px; display: flex; flex-direction: column; }
@media (min-aspect-ratio: 1/1) { #tablero { left: 128px; top: 52px; } }
#barra { position: relative; flex: none; height: 56px; margin-bottom: 6px; }
#series { position: absolute; inset: 0; pointer-events: none; }
#mesa { position: relative; flex: 1; min-height: 0; }
.fantasma { pointer-events: none; will-change: transform; }
/* Brillo de la serie terminada: trazo delgado luminoso alrededor de cada carta (dura toda la animación) y chispas que se sueltan */
.fantasma.brillo::after { content: ""; position: absolute; inset: -3px; border-radius: 9px; border: 2px solid #fff4a8; pointer-events: none;
  box-shadow: 0 0 9px 2px rgba(255,214,64,.9), inset 0 0 6px rgba(255,214,64,.7); animation: brillar .6s ease-in-out infinite alternate; }
@keyframes brillar { from { opacity: .6; } to { opacity: 1; } }
.fantasma.apagando::after { animation: none; opacity: 0; transition: opacity .3s; }
.chispa { position: absolute; z-index: 200; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, #ffe36a 55%, rgba(255,200,40,0) 75%); }
.chispa.estrella { border-radius: 0; background: #fff3a8; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.mazo { position: absolute; left: var(--x9, 0px); top: 0; width: var(--cw, 34px); height: var(--ch, 48px); padding: 0; cursor: pointer; touch-action: manipulation;
  background: repeating-linear-gradient(45deg, #2b4d9b 0 4px, #3b63c4 4px 8px); border: 1px solid #14285c; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.4); } /* = una carta boca abajo de la partida */
.mazo:active:not(:disabled) { transform: translateY(1px); }
.mazo:disabled { opacity: .35; cursor: default; }
.mazo:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.mazo-n { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 20px; padding: 0 5px; font: 800 11px/16px system-ui, sans-serif; text-align: center; color: #fff; background: #1b1d22; border: 2px solid #fff; border-radius: 999px; }
.col { position: absolute; top: 0; bottom: 0; }
.hueco { position: absolute; left: 0; top: 0; border: 2px dashed var(--txt-fondo-suave); border-radius: 6px; opacity: .55; }
.carta { position: absolute; left: 0; display: flex; justify-content: flex-start; align-items: flex-start; padding: 2px 3px; font-weight: 800; line-height: 1; color: #1b1d22; background: linear-gradient(180deg, #fff, #ecebe6); border: 1px solid #555; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.carta.roja { color: #c4261d; }
.carta .pl { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; opacity: .85; }
.carta.dorso { background: repeating-linear-gradient(45deg, #2b4d9b 0 4px, #3b63c4 4px 8px); border-color: #14285c; }
.carta.sel { outline: 3px solid #ffb020; outline-offset: -1px; transform: translateY(-3px); z-index: 3; }
/* Avisos sobre la mesa: recuadro ROJO delgado con triple parpadeo (tramo bloqueado), recuadro VERDE (pista de movimiento)
   y «Repartir» en AMARILLO OSCURO cuando ya no quedan movimientos. Los recuadros no reciben toques. */
.zona { position: absolute; pointer-events: none; opacity: 0; border: 2px solid #e0201b; border-radius: 8px; box-shadow: 0 0 5px rgba(224,32,27,.6); }
.zona-mal { animation: triple .42s steps(1, end) 3 forwards; }
@keyframes triple { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
.zona-pista { border-color: #16a34a; box-shadow: 0 0 8px rgba(22,163,74,.9); animation: pulso 1s ease-in-out infinite; }
.zona-dest { border-style: dashed; }
@keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
.alerta-rep { outline: 4px solid #b8860b; outline-offset: 3px; animation: amarillo .8s ease-in-out infinite; }
@keyframes amarillo { 50% { outline-color: rgba(184,134,11,.1); } }
@media (prefers-reduced-motion: reduce) { .zona-mal, .zona-pista { animation: none; opacity: 1; } .alerta-rep { animation: none; } }
.barra-inf { position: fixed; z-index: 5; bottom: max(14px, env(safe-area-inset-bottom)); left: 64px; right: 64px; display: flex; justify-content: center; align-items: center; gap: 12px; pointer-events: none; }
.barra-inf > * { pointer-events: auto; }
.chip small { margin-right: 4px; }
#toast { position: fixed; z-index: 8; left: 50%; bottom: 80px; transform: translateX(-50%); padding: 8px 16px; font-weight: 800; color: #fff; background: rgba(20,22,26,.9); border-radius: 999px; }
#toast[hidden] { display: none; }
</style>
</head>
<body class="inmersivo">
<nav class="nav-juego" aria-label="Navegación">
  <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
  <button class="b3d txt b-gris" id="btn-menu" type="button" title="Pausa" hidden><span class="b-ico">☰</span> Pausa</button>
</nav>

<main class="pantalla" id="menu">
  <h1>🕷️ Spider</h1>
  <p>Ordena cada palo de K a A y quita las 8 series. Elige cuántos palos y qué tan difícil es el reparto.</p>
  <div class="fila" id="palos" role="group" aria-label="Palos de la baraja"></div>
  <div class="fila" id="dificultades" role="group" aria-label="Dificultad del reparto"></div>
  <p id="desc-dif"></p>
  <div class="fila principales">
    <button class="b3d txt b-verde" id="b-libre" type="button"><span class="b-ico">♾️</span> Modo libre</button>
    <button class="b3d txt b-azul" id="b-niveles" type="button"><span class="b-ico">🎯</span> Niveles</button>
    <button class="b3d txt b-morado" id="b-mapa" type="button"><span class="b-ico">🗺️</span> Mapa</button>
  </div>
  <p id="aviso" aria-live="polite"></p>
  <p id="mejores"></p>
</main>

<section class="pantalla" id="juego" hidden aria-label="Partida">
  <div class="hud hud-der">
    <span class="chip" id="c-tiempo">0:00</span>
    <span class="chip"><small>Mov.</small><span id="c-movs">0</span></span>
    <span class="chip"><small>Series</small><span id="c-series">0/8</span></span>
  </div>
  <div id="tablero">
    <div id="barra" aria-label="Series terminadas y mazo de repartos">
      <div id="series" aria-hidden="true"></div>
      <button class="mazo" id="b-repartir" type="button" title="Repartir" aria-label="Repartir una carta en cada columna"><span class="mazo-n" id="n-rep">5</span></button>
    </div>
    <div id="mesa"></div>
  </div>
  <div class="barra-inf">
    <button class="b3d txt b-azul" id="b-deshacer" type="button"><span class="b-ico">↶</span> Deshacer</button>
    <span class="chip" id="c-estado"></span>
  </div>
</section>
<div id="toast" hidden role="status"></div>

<script type="module" src="juego-spider.js"></script>
<script type="module" src="../compartido/fondo-madera.js"></script>
<script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
