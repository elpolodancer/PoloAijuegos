<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d3d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="iconos/icono-192.png" />
  <title>Portal de Juegos El Polo · Sin internet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f1f2f4; background: #0b0d3d; text-align: center; }
    main { max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; object-fit: contain; }
    h1 { margin: 14px 0 8px; font-size: 1.4rem; }
    p { margin: 8px 0; color: #b0b4bd; line-height: 1.4; }
    .fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
    a, button { padding: 11px 18px; font: inherit; font-weight: 700; color: #fff; background: #7c5cff; border: 0; border-radius: 12px; cursor: pointer; text-decoration: none; }
    button.sec { background: #3b3e46; }
  </style>
</head>
<body>
<main>
  <img src="imagenes/logo-portal.webp" alt="" onerror="this.hidden=true" />
  <h1>📴 Sin internet</h1>
  <p>Esta página todavía no se guardó en tu dispositivo. Los juegos que ya abriste con internet siguen funcionando sin conexión.</p>
  <p>Conéctate una vez y abre el portal: se guardará todo para la próxima.</p>
  <div class="fila">
    <a href="index.html">Ir al portal</a>
    <button class="sec" type="button" onclick="location.reload()">Reintentar</button>
  </div>
</main>
</body>
</html>
