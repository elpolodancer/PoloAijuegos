<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />

  <title>Jardín contra zombis</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: radial-gradient(ellipse at 50% 30%, #23252b, #101114 70%); }
    /* Juego vertical (lienzo 450×470, con cartas y menús dibujados en el propio lienzo): franja libre arriba y abajo */
    .inmersivo .escena { padding: calc(54px + env(safe-area-inset-top)) 0 calc(54px + env(safe-area-inset-bottom)); }
    .inmersivo .marco {
      aspect-ratio: 450 / 470;
      width: min(100vw, calc((100vh - 108px) * 450 / 470));
      width: min(100vw, calc((100dvh - 108px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 450 / 470));
    }
    .inmersivo .lienzo { touch-action: none; }
    /* Resumen del nivel: burbuja que se desvanece sola */
    #estado { position: fixed; z-index: 4; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 140px); margin: 0; padding: 6px 12px; font-size: .75rem; line-height: 1.3; text-align: center; color: #fff4c2; pointer-events: none;
      background: rgba(30,32,37,.92); border: 2px solid #15171a; border-radius: 14px; animation: desv .6s 8s forwards; }
    #estado:empty { display: none; }
    @keyframes desv { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { #estado { animation-duration: .01s; } }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <div class="hud hud-izq">

  </div>
  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="450" height="470" aria-label="Jardín contra zombis"></canvas>
    </div>
  </div>
  <p id="estado" role="status"></p>
  <script type="module" src="juego-plantasvszombies.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
