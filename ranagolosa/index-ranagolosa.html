<!DOCTYPE html>
<!-- Ruta: ranagolosa/index-ranagolosa.html -->
<html lang="es" class="inmersivo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d9a866">
<title>Rana golosa</title>
<link rel="stylesheet" href="../compartido/estilos.css">
<link rel="stylesheet" href="../compartido/inmersivo.css">
<script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
<style>
  /* Juego 16:9 (el estándar trae 4:3) y lienzo transparente para que se vea la madera */
  .inmersivo .marco { aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); }
  .inmersivo .lienzo { background: transparent; }
  .niveles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 12px 0 4px; }
  .niveles .b3d { --t: 44px; width: 100%; font-size: 16px; font-weight: 800; }
  .pausa-panel p { margin: 0 0 12px; color: #d6d9df; }
  .pausa-panel .b3d.txt { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body class="inmersivo">
  <nav class="nav-juego" aria-label="Navegación">
    <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
    <button class="b3d txt b-gris" id="btn-menu" type="button" title="Pausa" hidden><span class="b-ico">☰</span> Pausa</button>
  </nav>

  <div class="hud hud-der" aria-live="polite">
    <span class="chip" id="chip-nivel"></span>
    <span class="chip" id="chip-estrellas"></span>
  </div>

  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" aria-label="Rana golosa"></canvas>
      <p class="solo-lector">Desliza el dedo sobre las cuerdas para cortarlas y que el dulce caiga en la boca de la rana, juntando estrellas.</p>
    </div>
  </div>

  <div class="pausa-fondo" id="menu">
    <div class="pausa-panel">
      <h2>🐸 Rana golosa</h2>
      <p>Corta las cuerdas para que el dulce caiga en la boca de la rana. ¡Junta las estrellas del camino!</p>
      <button class="b3d txt b-verde" id="btn-continuar" type="button"></button>
      <div class="niveles" id="niveles"></div>
    </div>
  </div>

  <div class="pausa-fondo" id="fin" hidden>
    <div class="pausa-panel">
      <h2 id="fin-titulo"></h2>
      <p id="fin-texto"></p>
      <button class="b3d txt b-verde" id="fin-sig" type="button"><span class="b-ico">▶</span> Siguiente nivel</button>
      <button class="b3d txt b-oro" id="fin-rep" type="button"><span class="b-ico">🔁</span> Repetir</button>
      <button class="b3d txt b-gris" id="fin-menu" type="button"><span class="b-ico">☰</span> Menú principal</button>
    </div>
  </div>

  <script type="module" src="juego-ranagolosa.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
