<!doctype html>
<!-- Ruta: buscaminas/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Buscaminas</title>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    .bm { max-width: 520px; margin: 0 auto; padding: 8px 12px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .bm-nivel, .bm-info { display: flex; gap: 8px; width: 100%; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .bm-nivel button, .bm-info button { font: inherit; }
    .bm-nivel .on { outline: 2px solid var(--acento, #6cf); }
    .bm-dato { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; min-width: 4.2em; }
    .bm-dato.der { text-align: right; }
    #cara { font-size: 1.6rem; line-height: 1; padding: 6px 12px; }
    #modo[aria-pressed="true"] { outline: 2px solid var(--acento, #6cf); }
    #tablero {
      --t: 36px;
      display: grid; gap: 2px; padding: 6px; border-radius: 10px;
      background: #1b2330; touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .c {
      width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 5px;
      font: 800 calc(var(--t) * .56)/1 system-ui, sans-serif; display: grid; place-items: center;
      background: #4c6a8f; color: #fff; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
    }
    .c:focus-visible { outline: 2px solid #ffd54a; outline-offset: 1px; }
    .c.ab { background: #263243; box-shadow: none; cursor: default; }
    .c.ab[data-n="0"] { background: #202b3a; }
    .c[data-n="1"] { color: #6ec1ff; } .c[data-n="2"] { color: #7bd88f; } .c[data-n="3"] { color: #ff8a80; }
    .c[data-n="4"] { color: #b39ddb; } .c[data-n="5"] { color: #ffb74d; } .c[data-n="6"] { color: #4dd0e1; }
    .c[data-n="7"] { color: #f48fb1; } .c[data-n="8"] { color: #cfd8dc; }
    .c.mina { background: #5a2a33; } .c.boom { background: #d9344a; } .c.mal { background: #5a2a33; }
    .bm-msg { min-height: 1.4em; text-align: center; color: var(--suave, #9ab); font-size: .9rem; }
    .bm-msg b { color: var(--texto, #fff); }
    @media (prefers-reduced-motion: no-preference) { .c { transition: background .12s; } }
  </style>
</head>
<body>
  <header class="barra">
    <a class="btn" href="../">← Portal</a>
    <h1>💣 Buscaminas</h1>
    <span></span>
  </header>
  <main class="bm">
    <div class="bm-nivel" id="niveles"></div>
    <div class="bm-info">
      <span class="bm-dato" id="minas">💣 0</span>
      <button class="btn" id="cara" aria-label="Reiniciar">🙂</button>
      <span class="bm-dato der" id="tiempo">⏱ 0</span>
    </div>
    <div id="tablero" role="grid" aria-label="Tablero"></div>
    <div class="bm-info">
      <button class="btn" id="modo" aria-pressed="false">🚩 Modo bandera: no</button>
    </div>
    <div class="bm-msg" id="msg"></div>
  </main>
  <script type="module" src="juego.js"></script>
</body>
</html>
