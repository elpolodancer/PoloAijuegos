<!doctype html>
<!-- Ruta: buscaminas/index-buscaminas.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Buscaminas</title>
  <meta name="theme-color" content="#d9a866" />
  <!-- Evita el parpadeo de la madera clara al abrir en modo oscuro -->
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    body.inmersivo { touch-action: manipulation; }

    /* ===== Pantallas (menú principal y niveles) ===== */
    .pantalla, .bm { position: absolute; inset: 0; display: flex; overflow-y: auto;
      padding: calc(104px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(86px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px)); }
    .caja { margin: auto; width: min(100%, 520px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .titulo { margin: 0; font-size: 2rem; line-height: 1.1; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    .sub { margin: 0; font-weight: 700; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); }
    .ayuda { margin: 0; font-size: .85rem; font-weight: 600; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); }
    .menu-botones { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .menu-botones .b3d { width: min(100%, 300px); font-size: 18px; }

    /* Selector de dificultad (en el menú y en niveles) */
    .dif { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }

    /* Cuadrícula de los 10 niveles */
    .rej-niv { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 12px; width: 100%; }
    .b3d.tile { --t: 62px; width: 100%; height: var(--t); flex-direction: column; gap: 1px; padding: 0; }
    .tile .num { position: relative; font-size: 22px; font-weight: 900; line-height: 1; }
    .tile small { position: relative; font-size: 11px; font-weight: 700; opacity: .92; }

    /* ===== Partida ===== */
    .bm { flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }

    /* Chips de minas y tiempo: arriba a la derecha, uno sobre otro */
    .hud-der.apilado { flex-direction: column; align-items: flex-end; gap: 8px; }
    .bm-dato { font-variant-numeric: tabular-nums; min-width: 4.6em; justify-content: center; }

    /* Carita, modo bandera y «siguiente nivel»: abajo al centro, entre 🌙 y ⛶ */
    .controles { position: fixed; z-index: 5; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }

    /* Visor del tablero: si el tablero (con zoom) es más grande que el espacio libre, se desplaza arrastrando con el dedo */
    #visor { flex: none; overflow: auto; border-radius: 12px; touch-action: pan-x pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    #tablero { --t: 36px; display: grid; gap: 2px; padding: 6px; border-radius: 12px; background: #1a1b20; box-shadow: 0 6px 0 #0c0d0f, 0 12px 20px rgba(0,0,0,.5); touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .c { width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 6px; font: 800 calc(var(--t) * .56)/1 system-ui, sans-serif; display: grid; place-items: center;
      background: linear-gradient(180deg, #9bbf5f, #6f9440); color: #fff; cursor: pointer; box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.28); }
    .c:focus-visible { outline: 2px solid #ffd54a; outline-offset: 1px; }
    .c.ab { background: #2c2e35; box-shadow: none; cursor: default; }
    .c.ab[data-n="0"] { background: #24262c; }
    .c[data-n="1"] { color: #6ec1ff; } .c[data-n="2"] { color: #7bd88f; } .c[data-n="3"] { color: #ff8a80; }
    .c[data-n="4"] { color: #b39ddb; } .c[data-n="5"] { color: #ffb74d; } .c[data-n="6"] { color: #4dd0e1; }
    .c[data-n="7"] { color: #f48fb1; } .c[data-n="8"] { color: #cfd8dc; }
    .c.mina { background: #5a2a33; } .c.boom { background: #d9344a; } .c.mal { background: #5a2a33; }

    /* Mensaje: va DIRECTO sobre la madera, así que usa los colores --txt-fondo */
    .bm-msg { min-height: 2.6em; max-width: 38ch; text-align: center; font-size: .9rem; font-weight: 600; line-height: 1.3; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); }
    .bm-msg b { color: var(--txt-fondo); }

    @media (prefers-reduced-motion: no-preference) { .c { transition: background .12s; } }

    /* ===== Pantalla horizontal ===== */
    @media (min-aspect-ratio: 23/20) {
      .pantalla, .bm { padding: calc(12px + env(safe-area-inset-top, 0px)) calc(150px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(150px + env(safe-area-inset-left, 0px)); }
      .controles { left: auto; bottom: auto; top: 50%; right: max(10px, env(safe-area-inset-right)); transform: translateY(-50%); flex-direction: column; gap: 10px; }
      .bm-msg { position: fixed; left: max(10px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); width: 130px; max-width: none; min-height: 0; text-align: left; }
      .caja { gap: 10px; }
      .menu-botones { gap: 8px; }
      .menu-botones .b3d { --t: 54px; }
      .titulo { font-size: 1.6rem; }
      .b3d.tile { --t: 54px; }
    }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <!-- Navegación estándar: 🎮 Juegos (portal) y ☰ (Pausa en partida / Menú principal en niveles; oculto en el menú principal) -->
  <nav class="nav-juego" aria-label="Navegación">
    <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
    <button class="b3d txt b-gris" id="btn-menu" type="button" title="Pausa" hidden><span class="b-ico">☰</span> <span id="btn-menu-txt">Pausa</span></button>
  </nav>

  <!-- ===== Menú principal ===== -->
  <section class="pantalla" id="p-menu" aria-label="Menú principal">
    <div class="caja">
      <h1 class="titulo">💣 Buscaminas</h1>
      <p class="sub" id="menu-sub"></p>
      <div class="menu-botones">
        <button class="b3d txt grande b-verde" id="b-jugar" type="button"><span class="b-ico">▶</span> <span id="jugar-txt">Jugar</span></button>
        <button class="b3d txt grande b-azul" id="b-niveles" type="button"><span class="b-ico">🗺️</span> Niveles</button>
        <button class="b3d txt grande b-morado" id="b-libre" type="button"><span class="b-ico">♾️</span> Modo infinito</button>
      </div>
      <p class="ayuda">Toca para abrir · mantén pulsado para poner bandera</p>
    </div>
  </section>

  <!-- ===== Modo infinito: tablero al azar, tamaño y dificultad a elegir ===== -->
  <section class="pantalla" id="p-libre" aria-label="Modo infinito" hidden>
    <div class="caja">
      <h1 class="titulo">♾️ Modo infinito</h1>
      <p class="sub">Elige el tamaño y la dificultad · no da puntos</p>
      <div class="dif" id="dif-libre" role="group" aria-label="Dificultad"></div>
      <div class="rej-niv" id="rej-niv"></div>
    </div>
  </section>

  <!-- El mapa de niveles (3200 niveles) lo dibuja compartido/mapa-niveles.js encima de todo -->

  <!-- ===== Partida ===== -->
  <div class="hud hud-der apilado" id="hud" hidden>
    <span class="chip bm-dato" id="minas">💣 0</span>
    <span class="chip bm-dato" id="tiempo">⏱ 0</span>
  </div>

  <main class="bm" id="juego" hidden>
    <div id="visor"><div id="tablero" role="grid" aria-label="Tablero"></div></div>
    <div class="bm-msg" id="msg" aria-live="polite"></div>
  </main>

  <div class="controles" id="controles" hidden>
    <button class="b3d b-oro" id="cara" type="button" aria-label="Reiniciar" title="Nueva partida"><span class="b-ico" id="cara-ico">🙂</span></button>
    <button class="b3d b-rojo" id="modo" type="button" aria-pressed="false" aria-label="Modo bandera" title="Modo bandera (toca para poner banderas)"><span class="b-ico">🚩</span></button>
    <button class="b3d chico b-azul" id="zoom" type="button" aria-label="Zoom" title="Zoom (tablero completo)" hidden><span class="b-ico">🔍</span><span class="b-info" id="zoom-info" hidden></span></button>
    <button class="b3d b-verde" id="siguiente" type="button" aria-label="Siguiente nivel" title="Siguiente nivel" hidden><span class="b-ico" id="sig-ico">➡️</span></button>
  </div>

  <script type="module" src="juego-buscaminas.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
