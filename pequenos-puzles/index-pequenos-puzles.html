<!doctype html>
<!-- Ruta: pequenos-puzles/index-pequenos-puzles.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pequeños puzles</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    .b-negro { --c1: #8a8f9c; --c2: #3c404a; --c3: #15171a; }

    /* ----- Menú de niveles: capa con scroll interno ----- */
    #menu { position: fixed; inset: 0; z-index: 1; overflow: auto; padding: calc(64px + env(safe-area-inset-top)) 14px calc(70px + env(safe-area-inset-bottom)); background: radial-gradient(ellipse at 50% 20%, #23252b, #101114 70%); }
    #menu > * { max-width: 460px; margin-left: auto; margin-right: auto; }
    #menu-texto { margin: 0 0 12px; color: var(--suave); text-align: center; }
    #niveles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    #niveles .b3d { --t: 100%; width: 100%; height: auto; aspect-ratio: 1; margin: 0 0 5px; font-size: 1.1rem; font-weight: 800; }
    #niveles .b3d:disabled { opacity: .55; }
    #niveles .b3d.hecho::after { content: "✓"; position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; font-size: 12px; line-height: 16px; text-align: center; color: #fff; background: #1d7f2a; border: 2px solid #fff; border-radius: 50%; }

    /* ----- Juego: toda la ventana, fondo de arena como en el original ----- */
    #juego { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; padding: calc(74px + env(safe-area-inset-top)) 8px calc(56px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 35%, #f3e3b0 0%, #e4c981 60%, #d4b36a 100%); touch-action: none; }
    #zona { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #lienzo { display: block; touch-action: none; user-select: none; -webkit-user-select: none; background: transparent; }
    /* Barra de tiempo flotante bajo los botones */
    .puz-barra { position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); top: calc(54px + env(safe-area-inset-top)); display: none; height: 12px; border-radius: 999px; background: rgba(16,17,20,.45); overflow: hidden; border: 2px solid #15171a; }
    .puz-barra > i { display: block; height: 100%; width: 100%; background: #4ade80; transform-origin: left; }
    .puz-barra.urge > i { background: #f0483a; }

    /* ----- Aviso de fin de nivel ----- */
    #velo { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 10; padding: 16px; }
    #velo.ver { display: flex; }
    #velo-caja { background: #1e2025; border: 2px solid #3b3e46; color: var(--texto); border-radius: 18px; padding: 20px 22px 16px; max-width: 340px; width: 100%; text-align: center; }
    #velo-caja h2 { margin: 0 0 6px; }
    #velo-caja p { margin: 0 0 14px; color: var(--suave); }
    #velo-botones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <section id="menu">
    <div class="hud hud-izq">
      <a class="b3d chico b-gris" href="../" aria-label="Volver a Juegos" title="Juegos"><span class="b-ico">🏠</span></a>
      <span class="chip">🧩 Pequeños puzles</span>
    </div>
    <p id="menu-texto"></p>
    <div id="niveles"></div>
  </section>

  <section id="juego" hidden>
    <div class="hud hud-izq">
      <a class="b3d chico b-gris" href="../" aria-label="Volver a Juegos" title="Juegos"><span class="b-ico">🏠</span></a>
      <b class="chip" id="titulo-nivel"></b>
      <b class="chip" id="tiempo"></b>
    </div>
    <div class="hud hud-der">
      <button class="b3d chico b-oro" id="b-reiniciar" type="button" title="Reiniciar nivel" aria-label="Reiniciar nivel"><span class="b-ico">↻</span></button>
      <button class="b3d chico b-azul" id="b-menu" type="button" title="Elegir nivel" aria-label="Elegir nivel"><span class="b-ico">☰</span></button>
    </div>
    <div class="puz-barra" id="barra"><i id="barra-i"></i></div>
    <div id="zona"><canvas id="lienzo"></canvas></div>
  </section>

  <div id="velo">
    <div id="velo-caja">
      <h2 id="velo-titulo"></h2>
      <p id="velo-texto"></p>
      <div id="velo-botones"></div>
    </div>
  </div>

  <script type="module" src="juego-pequenos-puzles.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
