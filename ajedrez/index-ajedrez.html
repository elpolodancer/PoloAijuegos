<!doctype html>
<!-- PROYECTO: Portal Juegos · Ruta: ajedrez/index-ajedrez.html -->
<!-- Inicio con mapa (ESTANDARES-juegos.md, sección 13): pantalla de inicio (Modo libre · Jugar · Mapa · Ajustes), el mapa de países es el menú principal.
     Los estilos de navegación, inicio, barra del nivel y Modo libre vienen de compartido/inmersivo.css (bloque «INICIO CON MAPA»). -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajedrez</title>
  <meta name="theme-color" content="#d9a866" />
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    body.inmersivo { touch-action: manipulation; }
    /* Zonas reservadas: arriba, la barra del nivel (🗺️ + nombre) y 🎮 / ☰; abajo, 🌙 y ⛶. La medida del tablero (ajustarTam en juego-ajedrez.js) lee estos márgenes. */
    .aj { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: calc(116px + env(safe-area-inset-top, 0px)) 10px calc(66px + env(safe-area-inset-bottom, 0px)); }
    .aj[hidden] { display: none; }
    .cab { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
    .fila { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
    #desc { width: 100%; max-width: 520px; text-align: center; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); font-size: .8rem; min-height: 1.3em; }
    #estado { width: 100%; text-align: center; font-weight: 700; min-height: 1.5em; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    .zona-tab { position: relative; }
    #tablero { --t: 44px; display: grid; grid-template-columns: repeat(8, var(--t)); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 4px #3b2a1a, 0 8px 18px rgba(0,0,0,.55); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .cas { position: relative; width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 0; display: grid; place-items: center; cursor: pointer; font-size: calc(var(--t) * .78); line-height: 1; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    .cla { background: #ecd9b0; } .osc { background: #b58863; }
    .cas::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
    .cas.ult::before { background: rgba(255, 213, 74, .45); }
    .cas.sel::before { background: rgba(255, 213, 74, .8); }
    .cas.sombra::before { background: rgba(255, 213, 74, .28); }   /* nivel del caballo: casillas donde hay que ponerlo */
    .som { opacity: .4; }
    .cas.jaque::before { background: radial-gradient(circle, rgba(231, 60, 80, .95) 0, rgba(231, 60, 80, 0) 72%); }
    .cas.dest::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 45, .38); }
    .cas.dest.cap::after { width: 86%; height: 86%; background: none; border: calc(var(--t) * .08) solid rgba(20, 30, 45, .38); }
    .cas:focus-visible { outline: 3px solid #ffd54a; outline-offset: -3px; }
    .p { position: relative; z-index: 1; }
    .bl { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 3px #000; }
    .ng { color: #151a22; text-shadow: 0 0 1px rgba(255, 255, 255, .45); }
    .co { position: absolute; z-index: 1; font: 700 calc(var(--t) * .22)/1 system-ui, sans-serif; opacity: .8; pointer-events: none; }
    .co.r { top: 2px; left: 3px; } .co.f { bottom: 2px; right: 3px; }
    .cla .co { color: #b58863; } .osc .co { color: #ecd9b0; }
    #promo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; display: flex; gap: 10px; padding: 10px; border-radius: 16px; background: rgba(15, 16, 19, .9); box-shadow: 0 8px 24px rgba(0,0,0,.6); }
    #promo[hidden] { display: none; }
    #promo .b3d { --t: 56px; font-size: 2rem; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    /* Chip de sesión (arriba a la derecha, en columna): tocable para iniciar o cerrar sesión; el nombre largo se recorta con «…» */
    #sesion { display: inline-block; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 30px; cursor: pointer; }
    /* ventanas de aviso / Info / confirmar: mismo estilo que la pausa (.pausa-*), sin velo propio */
    #dialogo { z-index: 110; }
    #dialogo p { margin: 0 0 14px; line-height: 1.4; font-size: 1rem; }
    .aj.en-nivel #desc { font-size: .95rem; max-width: 560px; }
    @media (prefers-reduced-motion: no-preference) { .cas::before { transition: background .15s; } }
    /* ≥ 640 px de ancho: la barra del nivel va en la fila de arriba, así que sobra espacio */
    @media (min-width: 640px) { .aj { padding-top: calc(70px + env(safe-area-inset-top, 0px)); } }
    /* Pantalla horizontal (PC, celular acostado): el tablero a la izquierda y los controles a la derecha */
    @media (min-aspect-ratio: 23/20) {
      .aj { display: grid; grid-template-columns: auto 280px; grid-template-rows: auto 1fr auto; grid-template-areas: "tab cab" "tab estado" "tab acc"; align-content: center; justify-content: center; gap: 12px 22px; padding: calc(70px + env(safe-area-inset-top, 0px)) 64px calc(8px + env(safe-area-inset-bottom, 0px)) 64px; }
      .aj[hidden] { display: none; }
      .zona-tab { grid-area: tab; align-self: center; } .cab { grid-area: cab; } #estado { grid-area: estado; align-self: center; } .acc { grid-area: acc; }
    }
    /* Celular horizontal bajo: la barra del nivel se queda arriba al centro (en una sola fila, sin invadir el chip de sesión) y el tablero baja un poco */
    @media (orientation: landscape) and (max-height: 560px) {
      .barra-nivel { left: 50%; transform: translateX(-50%); max-width: calc(100% - 340px); flex-wrap: nowrap; }
      .aj { padding-top: calc(56px + env(safe-area-inset-top, 0px)); }
    }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <!-- Navegación cuadrada (13.3): 🎮 siempre; ☰ oculto en el inicio y en la vista principal del mapa -->
  <nav class="nav-juego cuadrada" aria-label="Navegación">
    <a class="b3d chico b-azuloscuro" id="btn-portal" href="../" title="Juegos: volver al portal" aria-label="Juegos: volver al portal"><span class="b-ico">🎮</span></a>
    <button class="b3d chico b-verdeclaro" id="btn-menu" type="button" title="Volver al menú principal" aria-label="Volver al menú principal" hidden><span class="b-ico">☰</span></button>
  </nav>
  <div class="hud hud-der columna">
    <span class="chip" id="sesion" role="button" tabindex="0" title="Iniciar sesión con Google"></span>
  </div>

  <!-- Dentro de un nivel o de una partida libre: 🗺️ + botón verde con el nombre (al tocarlo pregunta si quieres salir) -->
  <div class="barra-nivel" id="barra-nivel" hidden>
    <button class="b3d b-azul btn-mapa" id="btn-mapa-juego" type="button" title="Mapa" aria-label="Mapa"><span class="b-ico">🗺️</span></button>
    <button class="b3d txt b-verde nombre" id="barra-juego" type="button"><span id="nombre-nivel"></span></button>
  </div>

  <!-- Pantalla de inicio (13.2): se ve UNA vez al abrir el juego; después el menú principal es el mapa -->
  <div class="pant-menu" id="inicio" hidden>
    <div class="ini-menu">
      <button class="b3d txt b-morado ini-libre" id="btn-inicio-libre" type="button"><span class="b-ico">♾️</span><span>Modo libre</span></button>
      <button class="b3d txt b-verde ini-jugar" id="btn-inicio-jugar" type="button"><span class="b-ico">▶</span><span>Jugar</span></button>
      <button class="b3d txt b-azul ini-mapa" id="btn-inicio-mapa" type="button"><span class="b-ico">🗺️</span><span>Mapa</span></button>
      <button class="b3d txt b-cielo ini-ajustes" id="btn-inicio-ajustes" type="button"><span class="b-ico">⚙️</span><span>Ajustes</span></button>
    </div>
  </div>

  <!-- El juego -->
  <main class="aj" hidden>
    <div class="cab"><div id="desc"></div></div>
    <div id="estado" role="status" aria-live="polite"></div>
    <div class="zona-tab">
      <div id="tablero" role="grid" aria-label="Tablero de ajedrez"></div>
      <div id="promo" hidden></div>
    </div>
    <div class="fila acc">
      <button class="b3d b-oro" id="bDeshacer" type="button" title="Deshacer" aria-label="Deshacer"><span class="b-ico">↩</span></button>
      <button class="b3d b-verde" id="bNueva" type="button" title="Nueva partida" aria-label="Nueva partida"><span class="b-ico">🔄</span></button>
      <button class="b3d txt b-verde" id="bSiguiente" type="button" hidden><span class="b-ico">▶</span> Siguiente nivel</button>
    </div>
  </main>

  <!-- ♾️ Modo libre (13.7): Dificultad (5 emojis) · Tu color · nota · récord · ▶ Jugar -->
  <div class="pant-menu" id="libre" hidden>
    <h2>♾️ Modo libre</h2>
    <p class="modo-grupo">Dificultad</p>
    <div class="modo-fila dif-fila" id="libre-niveles" role="group" aria-label="Dificultad"></div>
    <p class="dif-nombre" id="dif-nombre"></p>
    <p class="modo-grupo">Tu color</p>
    <div class="modo-fila" id="libre-color" role="group" aria-label="Tu color"></div>
    <p class="libre-nota" id="libre-nota"></p>
    <p class="libre-record" id="libre-record"></p>
    <div class="libre-jugar">
      <button class="b3d txt grande b-verde" id="btn-libre-jugar" type="button"><span class="b-ico">▶</span> Jugar</button>
    </div>
  </div>

  <!-- Fin de nivel / de partida: SOBRE el tablero, sin velo (ESTANDARES-juegos.md, sección 6) -->
  <div class="sobre-tablero" id="fin" hidden>
    <div class="sobre-texto"><h2 id="fin-tit"></h2><div id="fin-txt"></div></div>
    <div id="fin-prim"></div>
    <div class="sobre-fila" id="fin-fila"></div>
  </div>

  <!-- Avisos, Info y confirmaciones (ventana .pausa-*) -->
  <div class="pausa-fondo" id="dialogo" role="dialog" aria-modal="true" hidden>
    <div class="pausa-panel">
      <h2 id="dialogo-tit"></h2>
      <p id="dialogo-txt"></p>
      <div class="pausa-opciones">
        <button class="b3d txt b-verde" id="dialogo-si" type="button">Sí</button>
        <button class="b3d txt b-cielo" id="dialogo-no" type="button">No</button>
      </div>
    </div>
  </div>

  <script type="module" src="juego-ajedrez.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
