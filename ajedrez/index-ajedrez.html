<!doctype html>
<!-- Ruta: ajedrez/index-ajedrez.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajedrez</title>
  <meta name="theme-color" content="#d9a866" />
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    body.inmersivo { touch-action: manipulation; }
    .aj { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; /* arriba 104 y abajo 66: zonas reservadas de 🎮 Juegos + ☰ y de 🌙 / ⛶ */ padding: calc(104px + env(safe-area-inset-top, 0px)) 10px calc(66px + env(safe-area-inset-bottom, 0px)); }
    .cab { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
    .fila { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
    #desc { width: 100%; max-width: 520px; text-align: center; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); font-size: .8rem; min-height: 1.3em; }
    #estado { width: 100%; text-align: center; font-weight: 700; min-height: 1.5em; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    .zona-tab { position: relative; }
    #tablero { --t: 44px; display: grid; grid-template-columns: repeat(8, var(--t)); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 4px #3b2a1a, 0 8px 18px rgba(0,0,0,.55); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .cas { position: relative; width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 0; display: grid; place-items: center; cursor: pointer; font-size: calc(var(--t) * .78); line-height: 1; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    .cla { background: #ecd9b0; } .osc { background: #b58863; }
    .cas::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
    .cas.ult::before { background: rgba(255, 213, 74, .45); }
    .cas.sel::before { background: rgba(255, 213, 74, .8); }
    .cas.jaque::before { background: radial-gradient(circle, rgba(231, 60, 80, .95) 0, rgba(231, 60, 80, 0) 72%); }
    .cas.dest::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 45, .38); }
    .cas.dest.cap::after { width: 86%; height: 86%; background: none; border: calc(var(--t) * .08) solid rgba(20, 30, 45, .38); }
    .cas:focus-visible { outline: 3px solid #ffd54a; outline-offset: -3px; }
    .p { position: relative; z-index: 1; }
    .bl { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 3px #000; }
    .ng { color: #151a22; text-shadow: 0 0 1px rgba(255, 255, 255, .45); }
    .co { position: absolute; z-index: 1; font: 700 calc(var(--t) * .22)/1 system-ui, sans-serif; opacity: .8; pointer-events: none; }
    .co.r { top: 2px; left: 3px; } .co.f { bottom: 2px; right: 3px; }
    .cla .co { color: #b58863; } .osc .co { color: #ecd9b0; }
    #promo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; display: flex; gap: 10px; padding: 10px; border-radius: 16px; background: rgba(15, 16, 19, .9); box-shadow: 0 8px 24px rgba(0,0,0,.6); }
    #promo[hidden] { display: none; }
    #promo .b3d { --t: 56px; font-size: 2rem; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    #aviso { position: fixed; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(10, 10, 12, .85); }
    #aviso p { margin: 0; font-size: 1.1rem; font-weight: 700; max-width: 28ch; }
    /* niveles del mapa: sin selector de dificultad ni de color; texto de enseñanza más grande */
    .aj.en-nivel #niveles, .aj.en-nivel #bBlancas, .aj.en-nivel #bNegras { display: none; }
    .aj.en-nivel #desc { font-size: .95rem; max-width: 560px; }
    @media (prefers-reduced-motion: no-preference) { .cas::before { transition: background .15s; } }
    /* Pantalla horizontal (PC, celular acostado): el tablero a la izquierda y los controles a la derecha */
    @media (min-aspect-ratio: 23/20) {
      .aj { display: grid; grid-template-columns: auto 280px; grid-template-rows: auto 1fr auto; grid-template-areas: "tab cab" "tab estado" "tab acc"; align-content: center; justify-content: center; gap: 12px 22px; padding: calc(8px + env(safe-area-inset-top, 0px)) 64px calc(8px + env(safe-area-inset-bottom, 0px)) 128px; }
      .zona-tab { grid-area: tab; align-self: center; } .cab { grid-area: cab; } #estado { grid-area: estado; align-self: center; } .acc { grid-area: acc; }
      .cab .fila { justify-content: flex-start; }
    }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <nav class="nav-juego" aria-label="Navegación">
    <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
    <button class="b3d txt b-gris" id="btn-menu" type="button" title="Pausa" hidden><span class="b-ico">☰</span> Pausa</button>
  </nav>
  <main class="aj" hidden>
    <div class="cab">
      <div class="fila">
        <div class="fila" id="niveles" role="group" aria-label="Nivel"></div>
      </div>
      <div id="desc"></div>
    </div>
    <div id="estado" role="status" aria-live="polite"></div>
    <div class="zona-tab">
      <div id="tablero" role="grid" aria-label="Tablero de ajedrez"></div>
      <div id="promo" hidden></div>
    </div>
    <div class="fila acc">
      <button class="b3d chico b-gris" id="bBlancas" type="button" title="Jugar con blancas" aria-label="Jugar con blancas"><span class="b-ico">♔</span></button>
      <button class="b3d chico b-gris" id="bNegras" type="button" title="Jugar con negras" aria-label="Jugar con negras"><span class="b-ico">♚</span></button>
      <button class="b3d b-oro" id="bDeshacer" type="button" title="Deshacer" aria-label="Deshacer"><span class="b-ico">↩</span></button>
      <button class="b3d b-verde" id="bNueva" type="button" title="Nueva partida" aria-label="Nueva partida"><span class="b-ico">🔄</span></button>
    </div>
  </main>
  <div id="aviso" hidden>
    <p id="avisoTxt"></p>
    <div class="fila">
      <button class="b3d txt b-verde" id="avisoSi" type="button">Sí</button>
      <button class="b3d txt b-rojo" id="avisoNo" type="button">No</button>
    </div>
  </div>
  <script type="module" src="juego-ajedrez.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
