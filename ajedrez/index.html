<!doctype html>
<!-- Ruta: ajedrez/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajedrez</title>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    .aj { max-width: 560px; margin: 0 auto; padding: 8px 12px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .fila { display: flex; gap: 6px; width: 100%; justify-content: center; flex-wrap: wrap; align-items: center; }
    .fila .btn { font: inherit; }
    .on { outline: 2px solid var(--acento, #6cf); }
    #desc { width: 100%; text-align: center; color: var(--suave, #9ab); font-size: .85rem; min-height: 1.3em; }
    #estado { width: 100%; text-align: center; font-weight: 700; min-height: 1.5em; }
    #tablero { --t: 44px; display: grid; grid-template-columns: repeat(8, var(--t)); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 4px #1b2330; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .cas { position: relative; width: var(--t); height: var(--t); padding: 0; border: 0; border-radius: 0; display: grid; place-items: center; cursor: pointer; font-size: calc(var(--t) * .78); line-height: 1; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    .cla { background: #c9d3dc; } .osc { background: #6b86a3; }
    .cas::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
    .cas.ult::before { background: rgba(255, 213, 74, .45); }
    .cas.sel::before { background: rgba(255, 213, 74, .8); }
    .cas.jaque::before { background: radial-gradient(circle, rgba(231, 60, 80, .95) 0, rgba(231, 60, 80, 0) 72%); }
    .cas.dest::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 45, .38); }
    .cas.dest.cap::after { width: 86%; height: 86%; background: none; border: calc(var(--t) * .08) solid rgba(20, 30, 45, .38); }
    .cas:focus-visible { outline: 3px solid #ffd54a; outline-offset: -3px; }
    .p { position: relative; z-index: 1; }
    .bl { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 3px #000; }
    .ng { color: #151a22; text-shadow: 0 0 1px rgba(255, 255, 255, .45); }
    .co { position: absolute; z-index: 1; font: 700 calc(var(--t) * .22)/1 system-ui, sans-serif; opacity: .7; pointer-events: none; }
    .co.r { top: 2px; left: 3px; } .co.f { bottom: 2px; right: 3px; }
    .cla .co { color: #4a617a; } .osc .co { color: #dbe4ec; }
    #promo { display: flex; gap: 8px; justify-content: center; padding: 8px; border-radius: 10px; background: #1b2330; }
    #promo[hidden] { display: none; }
    #promo button { font-size: 2rem; line-height: 1; padding: 4px 12px; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif; }
    @media (prefers-reduced-motion: no-preference) { .cas::before { transition: background .15s; } }
  </style>
</head>
<body>
  <header class="barra">
    <a class="btn" href="../">← Portal</a>
    <h1>♟️ Ajedrez</h1>
    <span></span>
  </header>
  <main class="aj">
    <div class="fila" id="niveles" role="group" aria-label="Nivel"></div>
    <div id="desc"></div>
    <div class="fila">
      <button class="btn" id="bBlancas">♔ Blancas</button>
      <button class="btn" id="bNegras">♚ Negras</button>
    </div>
    <div id="estado" role="status" aria-live="polite"></div>
    <div id="tablero" role="grid" aria-label="Tablero de ajedrez"></div>
    <div id="promo" hidden></div>
    <div class="fila">
      <button class="btn" id="bDeshacer">↩ Deshacer</button>
      <button class="btn" id="bNueva">Nueva partida</button>
    </div>
  </main>
  <script type="module" src="juego.js"></script>
</body>
</html>
