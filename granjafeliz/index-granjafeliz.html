<!doctype html>
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9a866">
  <title>Granja feliz</title>
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css">
  <link rel="stylesheet" href="../compartido/inmersivo.css">
  <style>
    .pantalla { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; text-align: center; }
    .pantalla h1, .pantalla h2 { margin: 0 0 4px; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    .pantalla p { margin: 0; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); }
    .columna { display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); }
    @media (max-height: 460px) { .pantalla h1 { font-size: 1.4rem; } .columna { gap: 6px; } }
    #c { position: fixed; z-index: 1; touch-action: none; -webkit-user-select: none; user-select: none; }
    #aviso-granja { position: fixed; z-index: 8; left: 50%; bottom: 62px; transform: translateX(-50%); max-width: min(92vw, 420px); padding: 8px 14px; border-radius: 12px; background: rgba(20,20,24,.92); color: #f1f2f4; font-weight: 600; text-align: center; }
    #girar { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(20,20,24,.92); color: #f1f2f4; font-size: 1.2rem; text-align: center; }
    @media (orientation: portrait) { body.en-juego #girar { display: flex; } }
  </style>
</head>
<body class="inmersivo">
  <nav class="nav-juego" aria-label="Navegación">
    <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
    <button class="b3d txt b-gris" id="btn-menu" type="button" title="Menú principal" hidden><span class="b-ico">☰</span> <span id="txt-menu">Menú principal</span></button>
  </nav>
  <div class="hud hud-der"><span class="chip chip-monedas" title="Monedas"><span class="moneda"></span><span id="n-monedas">0</span></span></div>

  <main class="pantalla" id="pantalla-menu">
    <h1>🐔 Granja feliz</h1>
    <div class="columna">
      <button class="b3d txt grande b-verde" id="btn-libre" type="button"><span class="b-ico">♾️</span> <span>Modo libre</span></button>
      <button class="b3d txt grande b-azul" id="btn-niveles" type="button"><span class="b-ico">🪜</span> <span>Niveles</span></button>
      <button class="b3d txt grande b-azul" id="btn-mapa" type="button"><span class="b-ico">🗺️</span> <span>Mapa</span></button>
      <a class="b3d txt grande b-rojo" href="../"><span class="b-ico">🚪</span> <span>Salir</span></a>
    </div>
  </main>

  <section class="pantalla" id="pantalla-libre" hidden>
    <h2>♾️ Modo libre</h2>
    <p>Elige la dificultad</p>
    <div class="columna" id="lista-dificultad"></div>
  </section>

  <canvas id="c" hidden></canvas>
  <div class="sobre-tablero" id="fin" hidden></div>
  <div id="aviso-granja" role="status" hidden></div>
  <div id="girar"><div style="font-size:2.5rem">📱↻</div>Gira el celular para jugar en horizontal</div>

  <script type="module" src="juego-granjafeliz.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
