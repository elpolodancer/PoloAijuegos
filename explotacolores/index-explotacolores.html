<!doctype html>
<!-- Ruta: explotacolores/index-explotacolores.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9a866">
  <title>Explota colores</title>
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <link rel="stylesheet" href="../compartido/estilos.css">
  <link rel="stylesheet" href="../compartido/inmersivo.css">
  <style>
    /* Solo lo propio de este juego; botones, chips y madera vienen de compartido/inmersivo.css */
    .pantalla { position: fixed; inset: 0; z-index: 1; }
    .menu { display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-y: auto; padding: 104px 16px 64px; }
    .menu > * { flex: none; }
    .menu h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 7vw, 2.6rem); text-align: center; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    .menu .b3d.grande { width: min(320px, 86vw); }
    .lista-dif { display: flex; flex-direction: column; gap: 8px; width: min(300px, 80vw); }
    .lista-dif .b3d { width: 100%; }
    .info { position: fixed; z-index: 4; display: flex; gap: 10px; pointer-events: none; }
    #tablero { position: fixed; z-index: 2; touch-action: none; cursor: pointer; }
    .fin { position: fixed; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: rgba(0,0,0,.45); }
    .fin .caja { padding: 12px 18px; text-align: center; color: #f1f2f4; background: rgba(20,22,26,.9); border-radius: 14px; }
    .fin .caja b { display: block; font-size: 1.6rem; }
    .fin .fila { display: flex; gap: 10px; }
    .aviso-niv { position: fixed; z-index: 9; left: 50%; bottom: 80px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; color: #fff; background: rgba(20,22,26,.92); }
  </style>
</head>
<body class="inmersivo">
  <nav class="nav-juego" aria-label="Navegación">
    <a class="b3d txt b-azuloscuro" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Portal de Juegos</a>
    <button class="b3d txt b-verde" id="btn-menu" type="button" title="Pausa" hidden><span class="b-ico">☰</span> Pausa</button>
  </nav>
  <div class="hud hud-der" id="hud-sesion"><button class="b3d txt b-azul" id="btn-sesion" type="button"><span class="b-ico">👤</span> Iniciar sesión</button></div>

  <main class="pantalla menu" id="menu">
    <h1>💥 Explota colores</h1>
    <button class="b3d txt grande b-verde" id="b-libre" type="button" aria-expanded="false"><span class="b-ico">♾️</span> Modo libre</button>
    <div class="lista-dif" id="lista-dif" hidden></div>
    <button class="b3d txt grande b-azul" id="b-niveles" type="button"><span class="b-ico">🪜</span> Niveles</button>
    <button class="b3d txt grande b-azul" id="b-mapa" type="button"><span class="b-ico">🗺️</span> Mapa</button>
    <a class="b3d txt grande b-rojo" href="../"><span class="b-ico">🚪</span> Salir</a>
  </main>

  <div class="info" id="info" hidden>
    <span class="chip" id="chip-puntos"></span>
    <span class="chip" id="chip-tiempo"></span>
  </div>
  <canvas id="tablero" hidden role="img" aria-label="Tablero de bloques de colores de 10 por 15"></canvas>
  <div class="fin" id="fin" hidden role="dialog" aria-label="Fin de la ronda">
    <div class="caja"><div>⏱️ ¡Se acabó el tiempo!</div><b id="fin-puntos"></b><div id="fin-record"></div></div>
    <button class="b3d txt grande b-verde" id="b-otra" type="button"><span class="b-ico">🔄</span> Jugar otra vez</button>
    <div class="fila"><button class="b3d txt b-azul" id="b-menu" type="button">Menú</button></div>
  </div>
  <div class="aviso-niv" id="aviso" role="status" hidden></div>

  <script type="module" src="juego-explotacolores.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
