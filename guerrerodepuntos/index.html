<!doctype html>
<!-- Ruta: guerrerodepuntos/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Devorador</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    #lienzo { background: #12203a; max-width: 400px; cursor: pointer; }
    .centro { text-align: center; }
    #accion { margin: 4px 6px; }
    #ayuda { font-size: .85rem; color: var(--suave); max-width: 400px; margin: 8px auto; }
  </style>
</head>
<body>
  <header class="barra">
    <a class="volver" href="../">← Juegos</a>
    <h1>🐲 Devorador</h1>
    <div id="sesion"></div>
  </header>
  <main class="centro">
    <p id="estado"></p>
    <canvas id="lienzo" class="lienzo" width="360" height="600"></canvas>
    <div>
      <button class="btn" id="accion" hidden>Reintentar</button>
      <button class="btn" id="reiniciar">Reiniciar nivel</button>
    </div>
    <p id="ayuda">Toca una zona conectada con la tuya para saltar a ella. Si el enemigo tiene un nivel menor que el tuyo, lo vences y sumas su nivel al tuyo. Si no, te vence él.</p>
  </main>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
