<!doctype html>
<!-- Ruta: rompecabezas/index-rompecabezas.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rompecabezas</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    /* --u = 1% del ancho de pantalla, con tope para que en la compu se vea como en el celular */
    :root { --u: min(1vw, 5.4px); }
    html.inmersivo { --fondo-juego: #1c1d21; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: #fff;
      font-family: "Arial Rounded MT Bold", "Nunito", "Baloo 2", ui-rounded, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    }
    /* (el modo inmersivo ya deja el body fijo y sin scroll) */

    /* Cada pantalla es una capa a pantalla completa con scroll PROPIO (la página no se desplaza) */
    .pantalla {
      position: fixed; inset: 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      background: #1c1d21 var(--jean, none);
      padding: calc(env(safe-area-inset-top, 0px) + var(--u) * 4 + 46px) max(0px, calc(50vw - var(--u) * 50)) calc(env(safe-area-inset-bottom, 0px) + var(--u) * 10);
    }
    .cab {
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: calc(var(--u) * 14); margin: calc(var(--u) * -2) calc(var(--u) * 4) calc(var(--u) * 7);
    }
    .carta:focus-visible { outline: 3px solid #ffc400; outline-offset: 3px; }
    .b-negro { --c1: #8a8f9c; --c2: #3c404a; --c3: #15171a; }

    .logo { margin: 0; padding: 0 calc(var(--u) * 2); font-size: calc(var(--u) * 9.2); white-space: nowrap; font-style: italic; font-weight: 900; letter-spacing: -.02em; color: #ffc400; text-shadow: 0 calc(var(--u) * .5) 0 #b57f00, 0 calc(var(--u) * 1) calc(var(--u) * 1.4) rgba(0, 0, 0, .4); }
    .tit { margin: 0; padding: 0 calc(var(--u) * 2); text-align: center; font-size: calc(var(--u) * 7.4); font-weight: 700; line-height: 1.1; }

    /* Cuadrículas */
    .cuadricula { display: grid; grid-template-columns: 1fr 1fr; padding: 0 calc(var(--u) * 5.5); column-gap: calc(var(--u) * 4.5); row-gap: calc(var(--u) * 6); }
    .carta { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: center; cursor: pointer; }
    .pila { display: grid; justify-items: center; gap: calc(var(--u) * .9); margin-bottom: calc(var(--u) * 1.2); }
    .pila i { display: block; height: calc(var(--u) * .7); background: #aab3bd; border-radius: 9px; }
    .pila i:nth-child(1) { width: 90%; } .pila i:nth-child(2) { width: 96%; }
    .marco { display: block; aspect-ratio: 1; overflow: hidden; background: #1e2025; border: calc(var(--u) * .3) solid #cfd6de; border-radius: calc(var(--u) * .5); }
    .marco canvas, .marco img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .nom { display: block; min-height: calc(var(--u) * 10); margin-top: calc(var(--u) * 1.6); font: 400 calc(var(--u) * 4.2)/1.25 system-ui, Roboto, sans-serif; text-transform: uppercase; letter-spacing: .02em; color: #eaf0f6; }
    .galeria { padding: 0 calc(var(--u) * 2.7); column-gap: calc(var(--u) * 3.8); row-gap: calc(var(--u) * 9); }
    .galeria .marco { border-width: calc(var(--u) * .25); border-color: #c4ccd5; }
    .vacio { grid-column: 1 / -1; padding: calc(var(--u) * 6); text-align: center; font-size: calc(var(--u) * 4.2); color: #c9ccd3; }

    /* Ajustes */
    #prevCaja { display: grid; place-items: center; margin: 0 calc(var(--u) * 5); }
    #prev { display: block; border: calc(var(--u) * .4) solid #d5dce4; border-radius: calc(var(--u) * .8); background: #1e2025; }
    .etq { margin: calc(var(--u) * 4.5) 0 calc(var(--u) * 1.6); text-align: center; font-size: calc(var(--u) * 5.2); }
    .etq b { font-size: calc(var(--u) * 6); font-weight: 700; }
    #rango {
      -webkit-appearance: none; appearance: none; display: block; width: calc(100% - var(--u) * 10); height: calc(var(--u) * 5.6);
      margin: calc(var(--u) * 2) calc(var(--u) * 5); padding: 0; overflow: visible; outline: 0; border-radius: 99px;
      background:
        linear-gradient(#ffd53d, #e3a300) 0 0 / calc(var(--f, .3) * (100% - var(--u) * 3.6) + var(--u) * 1.8) 100% no-repeat,
        linear-gradient(#8d8d8d, #5c5c5c);
      box-shadow: inset 0 calc(var(--u) * .5) calc(var(--u) * .9) rgba(0, 0, 0, .4);
    }
    #rango::-webkit-slider-thumb { -webkit-appearance: none; width: calc(var(--u) * 3.6); height: calc(var(--u) * 7.8); border: calc(var(--u) * .25) solid #5d5d5d; border-radius: calc(var(--u) * 1.1); background: linear-gradient(90deg, #cfcfcf, #9b9b9b 50%, #c6c6c6); box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * .8) rgba(0, 0, 0, .45); }
    #rango::-moz-range-thumb { width: calc(var(--u) * 3.6); height: calc(var(--u) * 7.8); border: calc(var(--u) * .25) solid #5d5d5d; border-radius: calc(var(--u) * 1.1); background: linear-gradient(90deg, #cfcfcf, #9b9b9b 50%, #c6c6c6); }
    .fila-rot { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3.6); font-size: calc(var(--u) * 4.8); }
    .interruptor { position: relative; width: calc(var(--u) * 18.5); height: calc(var(--u) * 6.4); padding: 0; border: calc(var(--u) * .25) solid #646464; border-radius: calc(var(--u) * .8); background: linear-gradient(#7a7a7a, #555); cursor: pointer; }
    .interruptor i { position: absolute; top: calc(var(--u) * .3); bottom: calc(var(--u) * .3); left: calc(var(--u) * .3); display: grid; place-items: center; width: calc(var(--u) * 9); border-radius: calc(var(--u) * .5); background: linear-gradient(#cdcdcd, #9c9c9c); color: #2a2a2a; font: normal calc(var(--u) * 3.8) system-ui, sans-serif; transition: left .15s; }
    .interruptor.on i { left: calc(100% - var(--u) * 9.3); }
    #jugar { --t: 58px; display: flex; width: min(78%, 280px); margin: calc(var(--u) * 9) auto 8px; font-size: 26px; border-radius: 18px; }
    .extras { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 5); }
    .extras .b3d { --t: 40px; font-size: 14px; }

    /* Juego */
    #juego { position: fixed; inset: 0; background: #cbb68e var(--lino, none); }
    #lienzo { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
        .marco { position: relative; }
    .borrar { position: absolute; top: calc(var(--u) * 1); right: calc(var(--u) * 1); display: grid; place-items: center; width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; font-size: calc(var(--u) * 4); line-height: 1; }

    /* Menús encima del juego */
    .velo { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: rgba(10, 12, 16, .78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .panel { width: min(88vw, 380px); padding: 22px 18px 24px; text-align: center; background: #1c1d21 var(--jean, none); border: 2px solid #cfd6de; border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
    .panel h2 { margin: 0 0 6px; font-size: 32px; }
    .panel p { margin: 0 0 16px; color: #c9ccd3; font-size: 17px; }
    .panel .b3d.txt { display: flex; width: 100%; --t: 52px; margin: 8px 0 5px; font-size: 20px; }
    .panel .b3d.txt.principal { font-size: 24px; }

    #confirmar { z-index: 40; }
    #confTxt { white-space: pre-wrap; overflow-wrap: anywhere; }
    #msg { z-index: 50; position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: 90vw; padding: 10px 16px; border-radius: 12px; background: #000c; color: #fff; text-align: center; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>

  <!-- 1. MENÚ: categorías -->
  <section id="menu" class="pantalla">
    <div class="cab">
      <div class="hud hud-izq"><a class="b3d chico b-gris" href="../" aria-label="Volver al portal de juegos" title="Volver al portal"><span class="b-ico">🏠</span></a></div>
      <h1 class="logo">Rompecabezas</h1>
    </div>
    <div id="cats" class="cuadricula"></div>
  </section>

  <!-- 2. CATEGORÍA: imágenes -->
  <section id="cat" class="pantalla" hidden>
    <div class="cab">
      <h2 class="tit" id="catTitulo"></h2>
      <div class="hud hud-der"><button class="b3d chico b-gris" id="catCerrar" type="button" aria-label="Cerrar" title="Cerrar"><span class="b-ico">✕</span></button></div>
    </div>
    <div id="catImgs" class="cuadricula galeria"></div>
  </section>

  <!-- 3. AJUSTES: número de piezas y rotación -->
  <section id="cfg" class="pantalla" hidden>
    <div class="cab">
      <div class="hud hud-der"><button class="b3d chico b-gris" id="cfgCerrar" type="button" aria-label="Cerrar" title="Cerrar"><span class="b-ico">✕</span></button></div>
    </div>
    <div id="prevCaja"><canvas id="prev"></canvas></div>
    <p class="etq">Número de piezas: <b id="nPiezas">36</b></p>
    <input type="range" id="rango" min="0" max="10" step="1" value="0" aria-label="Número de piezas" />
    <div class="fila-rot">
      <span>Rotación de las piezas:</span>
      <button class="interruptor" id="rot" role="switch" aria-checked="false" aria-label="Rotación de las piezas"><i>0</i></button>
    </div>
    <button class="b3d txt b-verde" id="jugar" type="button"><span class="b-ico">▶️</span> Jugar</button>
    <div class="extras">
      <button class="b3d txt b-azul" id="guardar" type="button" hidden title="Sube la imagen a imgbb (requiere sesión con Google)"><span class="b-ico">☁️</span> Guardar imagen</button>
      <button class="b3d txt b-gris" id="enlace" type="button" hidden><span class="b-ico">🔗</span> Copiar enlace</button>
    </div>
  </section>

  <!-- 4. JUEGO -->
  <section id="juego" hidden>
    <canvas id="lienzo"></canvas>
    <div class="hud hud-der">
      <button class="b3d chico b-oro" id="guardarPartida" type="button" aria-label="Guardar partida" title="Guardar partida"><span class="b-ico">💾</span></button>
      <button class="b3d chico b-gris" id="pausa" type="button" aria-label="Pausa" title="Pausa"><span class="b-ico">⏸️</span></button>
    </div>
  </section>

  <div class="velo" id="pausaMenu" hidden>
    <div class="panel" role="dialog" aria-label="Pausa">
      <h2>Pausa</h2>
      <p id="pausaInfo"></p>
      <button class="b3d txt b-verde principal" id="pContinuar" type="button">▶️ Continuar</button>
      <button class="b3d txt b-azul" id="pGuia" type="button">🖼️ Ver imagen guía</button>
      <button class="b3d txt b-oro" id="pGuardar" type="button">💾 Guardar partida</button>
      <button class="b3d txt b-morado" id="pMezclar" type="button">🔀 Mezclar de nuevo</button>
      <button class="b3d txt b-gris" id="pPiezas" type="button">🧩 Cambiar piezas</button>
      <button class="b3d txt b-rojo" id="pSalir" type="button">🚪 Salir</button>
    </div>
  </div>

  <div class="velo" id="finMenu" hidden>
    <div class="panel" role="dialog" aria-label="Rompecabezas completo">
      <h2>¡Completo! 🎉</h2>
      <p id="finInfo"></p>
      <button class="b3d txt b-verde principal" id="fOtra" type="button">🔁 Jugar otra vez</button>
      <button class="b3d txt b-gris" id="fPiezas" type="button">🧩 Cambiar piezas</button>
      <button class="b3d txt b-gris" id="fSalir" type="button">🖼️ Elegir otra imagen</button>
    </div>
  </div>

  <div class="velo" id="loginMenu" hidden>
    <div class="panel" role="dialog" aria-label="Iniciar sesión para guardar">
      <h2>Inicia sesión</h2>
      <p>Para guardar la partida, tu imagen se sube a tu galería y eso necesita que entres con Google.</p>
      <button class="b3d txt b-azul principal" id="lEntrar" type="button">🔑 Entrar con Google</button>
      <button class="b3d txt b-gris" id="lCancelar" type="button">Ahora no</button>
    </div>
  </div>

  <div class="velo" id="confirmar" hidden>
    <div class="panel" role="alertdialog" aria-label="Confirmar">
      <p id="confTxt"></p>
      <button class="b3d txt b-verde principal" id="confSi" type="button">Continuar</button>
      <button class="b3d txt b-gris" id="confNo" type="button">Cancelar</button>
    </div>
  </div>

  <input type="file" id="archivo" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
  <div id="msg" hidden></div>

  <script type="module" src="juego-rompecabezas.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
