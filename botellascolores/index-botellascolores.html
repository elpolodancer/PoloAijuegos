<!doctype html>
<!-- Ruta: botellascolores/index-botellascolores.html -->
<!-- Inicio con mapa (ESTANDARES-juegos.md, sección 13; referencia: 5deslizante). Los estilos de .pant-menu, .ini-*, .barra-nivel, .cuadros-datos, .dif-*, .libre-* y .aj-* viven en compartido/inmersivo.css -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Botellas de colores</title>
  <meta name="theme-color" content="#d9a866" />
  <!-- Instalar SOLO este juego: manifest e iconos propios (no el del portal) y service worker propio (sw-botellascolores.js, lo registra juego-botellascolores.js) -->
  <link rel="manifest" href="manifest-botellascolores.webmanifest" />
  <link rel="apple-touch-icon" href="icono-180-botellascolores.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Botellas" />
  <script>
    // Chrome avisa que se puede instalar con «beforeinstallprompt», a veces ANTES de que cargue el módulo del juego: se guarda aquí para el botón «Instalar».
    window.__pwa = { evento: null };
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__pwa.evento = e; });
  </script>
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <style>
    [hidden] { display: none !important; }
    :root { --vidrio: #3a3d45; --vidrio-borde: rgba(232, 236, 245, .85); }

    /* Fondo: madera clara/oscura (compartido/fondo-madera.js); aquí no se pone fondo propio */

    /* La partida no se desplaza; si las botellas no caben, esta zona hace scroll por dentro.
       Arriba se deja libre la barra del nivel y los tres cuadros de datos (celular vertical ≈ 190 px; pantalla ancha ≈ 140 px); abajo, 84 px para los boosts y el ⛶ */
    .zona { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: calc(190px + env(safe-area-inset-top, 0px)) 12px calc(84px + env(safe-area-inset-bottom, 0px)); }
    .zona > section { width: 100%; max-width: 480px; margin: 0 auto; }
    @media (min-width: 640px) { .zona { padding-top: calc(140px + env(safe-area-inset-top, 0px)); } }
    /* Celular en horizontal (poco alto): la barra y los cuadros pasan a una columna a la izquierda y la mesa ocupa el resto */
    @media (orientation: landscape) and (max-height: 560px) {
      .zona { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(70px + env(safe-area-inset-bottom, 0px)) calc(256px + env(safe-area-inset-left, 0px)); }
      .zona > section { max-width: 760px; }
      #juego { gap: 6px; }
      #mesa { gap: 16px 8px; padding-top: 16px; }
    }

    #pista { margin: 0; min-height: 1.2em; font-size: .85rem; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); text-align: center; }
    .seg.oculto { display: flex; align-items: center; justify-content: center; background: #4a4f57; color: rgba(255,255,255,.6); font-weight: 800; font-size: 14px; }

    /* Arriba a la derecha: la sesión (tocable) y debajo ↩ Deshacer; el chip de monedas baja a la barra del nivel dentro de una partida */
    #sesion { cursor: pointer; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 30px; }

    /* ----- Partida ----- */
    #juego { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #mesa { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 12px; width: 100%; padding-top: 22px; }

    /* ----- Botella de vidrio ----- */
    .bot { --alto: 28px; width: 52px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bot.sel { transform: translateY(-18px); }

    .cuello { position: relative; z-index: 1; width: 22px; height: 20px; margin-bottom: -2px; box-sizing: border-box;
      border: 2px solid var(--vidrio-borde); border-bottom: 0; background: var(--vidrio); }
    .cuello::before { /* aro de la boca */
      content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
      width: 30px; height: 7px; box-sizing: border-box; border: 2px solid var(--vidrio-borde); border-radius: 5px; background: var(--vidrio);
    }

    .cuerpo { position: relative; width: 46px; display: flex; flex-direction: column-reverse; padding: 3px; overflow: hidden;
      box-sizing: content-box; border: 2px solid var(--vidrio-borde); border-radius: 18px 18px 24px 24px; background: var(--vidrio);
      height: calc(var(--cap) * var(--alto)); }
    .cuerpo, .cuello { box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
    .cuerpo::after { /* brillo del vidrio */
      content: ""; position: absolute; left: 7px; top: 10px; bottom: 16px; width: 4px; border-radius: 4px; pointer-events: none;
      background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.05));
    }
    .seg { width: 100%; height: var(--alto); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }

    .bot.lista .cuerpo, .bot.lista .cuello { border-color: #6ee7a8; }
    .bot.lista .cuerpo { box-shadow: 0 0 12px #6ee7a899; }

    /* Boosts: fila abajo al centro, entre 🌙/☀️ (izquierda) y ⛶ (derecha). Gris = no alcanza o no aplica */
    #boosts { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 14px; }
    #boosts[hidden] { display: none; }
    #boosts .b3d { --t: 48px; }
    /* Pista: la botella de donde se vierte (dorado) y la que recibe (celeste) */
    .bot.pista-o .cuerpo, .bot.pista-o .cuello { border-color: #ffe066; }
    .bot.pista-o .cuerpo { box-shadow: 0 0 14px #ffe066, 0 0 0 3px #ffe06688; }
    .bot.pista-d .cuerpo, .bot.pista-d .cuello { border-color: #7fe3ff; }
    .bot.pista-d .cuerpo { box-shadow: 0 0 14px #7fe3ff, 0 0 0 3px #7fe3ff88; }
    @media (prefers-reduced-motion: no-preference) { .bot.pista-o, .bot.pista-d { animation: latidoPista .7s ease-in-out infinite alternate; } }
    @keyframes latidoPista { to { filter: brightness(1.35); } }

    /* Aviso breve («🚧 Los niveles todavía no están creados») */
    #aviso { position: fixed; z-index: 120; left: 50%; top: calc(110px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); pointer-events: none; }
    #aviso[hidden] { display: none; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <!-- Navegación del inicio con mapa (sección 13.3): 🎮 y ☰ cuadrados, solo icono (el texto va en title y aria-label). El ☰ lo rotula el juego según la pantalla -->
  <nav class="nav-juego cuadrada" aria-label="Navegación">
    <a class="b3d chico b-azuloscuro" id="btn-portal" href="../" title="Juegos: volver al portal" aria-label="Juegos: volver al portal"><span class="b-ico">🎮</span></a>
    <button class="b3d chico b-verdeclaro" id="btn-menu" type="button" title="Volver al menú principal" aria-label="Volver al menú principal" hidden><span class="b-ico">☰</span></button>
  </nav>
  <!-- Arriba a la derecha, en columna: sesión; debajo, el chip de monedas (dentro de una partida pasa a la barra del nivel) y ↩ Deshacer -->
  <div class="hud hud-der columna">
    <span class="chip" id="sesion" role="button" tabindex="0" title="Iniciar sesión con Google">👤 Iniciar sesión</span>
    <span class="chip chip-monedas saldo" id="monedas" title="Tus monedas"><span class="moneda"></span><span class="num-saldo">0</span></span>
    <button class="b3d chico b-oro" id="deshacer" type="button" title="Deshacer" aria-label="Deshacer" hidden><span class="b-ico">↩</span></button>
  </div>
  <!-- Dentro de un nivel: 🗺️ + botón verde con el nombre del nivel (al tocarlo pregunta «¿Salir?») -->
  <div class="barra-nivel" id="barra-nivel" hidden>
    <button class="b3d b-azul btn-mapa" id="btn-mapa-juego" type="button" title="Mapa" aria-label="Mapa"><span class="b-ico">🗺️</span></button>
    <button class="b3d txt b-verde nombre" id="barra-juego" type="button" title="Salir al mapa"><span id="nombre-nivel"></span></button>
  </div>
  <!-- Tres cuadros azules, cada uno un poco más oscuro que el anterior -->
  <div class="cuadros-datos" id="cuadros" hidden>
    <div>Movimientos<b id="movs">0</b></div>
    <div>Botellas listas<b id="listas">0/0</b></div>
    <div><span id="rot-tercero">Tipo</span><b id="val-tercero">–</b></div>
  </div>

  <!-- Pantalla de inicio (13.2): se ve UNA sola vez, al abrir el juego. Sin título y sin ☰ -->
  <section class="pant-menu" id="pantalla-inicio" hidden>
    <div class="ini-menu">
      <button class="b3d txt ini-libre b-morado" id="btn-inicio-libre" type="button"><span class="b-ico">♾️</span><span>Modo libre</span></button>
      <button class="b3d txt ini-jugar b-verde" id="btn-inicio-jugar" type="button"><span class="b-ico">▶</span><span>Jugar</span></button>
      <button class="b3d txt ini-mapa b-azul" id="btn-inicio-mapa" type="button"><span class="b-ico">🗺️</span><span>Mapa</span></button>
      <button class="b3d txt ini-ajustes b-cielo" id="btn-inicio-ajustes" type="button"><span class="b-ico">⚙️</span><span>Ajustes</span></button>
    </div>
  </section>

  <!-- Modo libre (13.7): Dificultad (5 emojis) primero y debajo las demás opciones; elegido b-oro on, el resto b-cielo -->
  <section class="pant-menu" id="pantalla-libre" hidden>
    <h2>♾️ Modo libre</h2>
    <p class="modo-grupo">Dificultad</p>
    <div class="modo-fila dif-fila" id="g-dificultad" role="group" aria-label="Dificultad"></div>
    <p class="dif-nombre" id="dif-nombre"></p>
    <p class="modo-grupo">Colores</p>
    <div class="modo-fila" id="g-colores" role="group" aria-label="Cantidad de colores"></div>
    <p class="modo-grupo">Capacidad de la botella</p>
    <div class="modo-fila" id="g-capacidad" role="group" aria-label="Capacidad de la botella"></div>
    <p class="libre-nota" id="notaLibre"></p>
    <p class="libre-record" id="recordLibre"></p>
    <div class="libre-jugar">
      <button class="b3d txt grande b-verde" id="jugarLibre" type="button"><span class="b-ico">▶</span> Jugar</button>
    </div>
  </section>

  <main class="zona" id="zona" hidden>
    <section id="juego">
      <p id="pista"></p>
      <div id="mesa"></div>
    </section>
  </main>

  <!-- Boosts del nivel (los crea el juego desde BOOSTS de economia-botellascolores.js) -->
  <div id="boosts" role="group" aria-label="Boosts" hidden></div>

  <!-- Fin de nivel o de ronda «sobre el tablero» (sección 6): «Siguiente» es el primer botón y el más grande -->
  <div class="sobre-tablero" id="final" hidden>
    <div class="sobre-texto"><h2 id="textoFinal"></h2><div id="detalleFinal"></div></div>
    <button class="b3d txt grande b-verde" id="siguiente" type="button">Siguiente nivel ▶</button>
    <div class="sobre-fila">
      <button class="b3d txt b-cielo" id="repetir" type="button">🔄 Repetir nivel</button>
      <button class="b3d txt b-cielo" id="finNiveles" type="button">🗺️ Mapa</button>
    </div>
  </div>

  <div id="aviso" class="sobre-texto" hidden></div>

  <script type="module" src="juego-botellascolores.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
</body>
</html>
