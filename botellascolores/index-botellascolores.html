<!doctype html>
<!-- Ruta: botellascolores/index-botellascolores.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Botellas de colores</title>
  <meta name="theme-color" content="#d9a866" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <script>try{if(localStorage.getItem("fondo_madera")==="oscura")document.documentElement.classList.add("oscura")}catch(e){}</script>
  <style>
    [hidden] { display: none !important; }
    :root { --vidrio: #3a3d45; --vidrio-borde: rgba(232, 236, 245, .85); }

    /* Fondo: madera clara/oscura (compartido/fondo-madera.js); aquí no se pone fondo propio */

    /* La pantalla no se desplaza; si las botellas no caben, esta zona hace scroll por dentro */
    .zona { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: calc(58px + env(safe-area-inset-top, 0px)) 12px calc(64px + env(safe-area-inset-bottom, 0px)); } /* 64px abajo: así el ⛶ no tapa las botellas */
    .zona > section { width: 100%; max-width: 480px; margin: 0 auto; }
    /* Celular en horizontal (poco alto): la mesa se ensancha para que las botellas queden en una sola fila y quepan sin scroll */
    @media (orientation: landscape) and (max-height: 520px) {
      .zona { padding-top: calc(52px + env(safe-area-inset-top, 0px)); }
      .zona > section { max-width: 860px; }
      #juego { gap: 6px; }
      #mesa { gap: 16px 8px; padding-top: 16px; }
    }

    #pista { margin: 0; font-size: .85rem; color: var(--txt-fondo-suave); text-shadow: var(--sombra-txt); text-align: center; }
    .seg.oculto { display: flex; align-items: center; justify-content: center; background: #4a4f57; color: rgba(255,255,255,.6); font-weight: 800; font-size: 14px; }

    /* ----- Inicio ----- */
    #menu { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; min-height: calc(100dvh - 130px); }
    #menuInfo { margin: 0 0 4px; text-align: center; font-weight: 700; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
    #menu .b3d { width: 100%; max-width: 340px; --t: 56px; height: 56px; font-size: 17px; }

    /* ----- Mapa de niveles ----- */
    #mapa { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px; background: rgba(16, 17, 20, .97); overflow: auto; }
    .mapa-caja { width: 100%; max-width: 760px; }
    .menu-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .menu-cab h2 { margin: 0; font-size: 1.3rem; text-align: center; }
    #mapaInfo { margin: 0 0 10px; color: var(--suave); font-size: .85rem; }
    #mapaLienzo svg { display: block; width: 100%; height: auto; border-radius: 12px; }
    #mapaLienzo .sel { cursor: pointer; }
    #mapaLienzo [role="button"]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #mapaLienzo .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 1.8s ease-out infinite; }
    @keyframes pulso { from { transform: scale(1); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #mapaLienzo .pulso { animation: none; } }
    .rejilla-niveles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding-bottom: 16px; }
    /* Botones de nivel: 3D como los demás; verde = pasado, dorado = el que sigue, gris = bloqueado */
    .nv { --c1: #d5d9e0; --c2: #8b93a0; --c3: #4f5662; position: relative; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; padding: 0; font: inherit; font-size: 1.05rem; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); cursor: pointer;
      background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 140%); border: 2px solid var(--c3); border-radius: 13px;
      box-shadow: 0 4px 0 var(--c3), 0 6px 8px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.55); transition: transform .07s, box-shadow .07s; touch-action: manipulation; }
    .nv:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--c3), inset 0 2px 0 rgba(255,255,255,.45); }
    .nv.hecho { --c1: #b6f7a6; --c2: #3fcf4a; --c3: #1d7f2a; }
    .nv.actual { --c1: #fff08c; --c2: #ffb020; --c3: #a85d00; box-shadow: 0 4px 0 var(--c3), 0 0 0 3px #fff, 0 6px 8px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.55); }
    .nv.bloq { --c1: #5b5f68; --c2: #3d4048; --c3: #26282d; opacity: .55; cursor: default; box-shadow: 0 4px 0 var(--c3); }
    .nv:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    .fila { display: flex; gap: 8px; width: 100%; justify-content: space-between; align-items: center; }
    #info { font-weight: 800; }
    #juego { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #mesa { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 12px; width: 100%; padding-top: 22px; }

    /* ----- Botella de vidrio ----- */
    .bot { --alto: 28px; width: 52px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .bot.sel { transform: translateY(-18px); }

    .cuello { position: relative; z-index: 1; width: 22px; height: 20px; margin-bottom: -2px; box-sizing: border-box;
      border: 2px solid var(--vidrio-borde); border-bottom: 0; background: var(--vidrio); }
    .cuello::before { /* aro de la boca */
      content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
      width: 30px; height: 7px; box-sizing: border-box; border: 2px solid var(--vidrio-borde); border-radius: 5px; background: var(--vidrio);
    }

    .cuerpo { position: relative; width: 46px; display: flex; flex-direction: column-reverse; padding: 3px; overflow: hidden;
      box-sizing: content-box; border: 2px solid var(--vidrio-borde); border-radius: 18px 18px 24px 24px; background: var(--vidrio);
      height: calc(var(--cap) * var(--alto)); }
    .cuerpo, .cuello { box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
    .cuerpo::after { /* brillo del vidrio */
      content: ""; position: absolute; left: 7px; top: 10px; bottom: 16px; width: 4px; border-radius: 4px; pointer-events: none;
      background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.05));
    }
    .seg { width: 100%; height: var(--alto); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }

    .bot.lista .cuerpo, .bot.lista .cuello { border-color: #6ee7a8; }
    .bot.lista .cuerpo { box-shadow: 0 0 12px #6ee7a899; }

    #final { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
    #final b { font-size: 1.2rem; color: var(--txt-fondo); text-shadow: var(--sombra-txt); }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <!-- Navegación estándar: «🎮 Juegos» vuelve al portal; «☰ Pausa» (solo en partida) abre el menú de pausa -->
  <nav class="nav-juego">
    <a class="b3d txt chico b-gris" href="../" title="Volver al portal de juegos"><span class="b-ico">🎮</span> Juegos</a>
    <button class="b3d txt chico b-gris" id="btn-menu" type="button" hidden><span class="b-ico">☰</span> Pausa</button>
  </nav>
  <div class="hud hud-der" id="hudJuego" hidden>
    <button class="b3d chico b-oro" id="deshacer" type="button" title="Deshacer" aria-label="Deshacer"><span class="b-ico">↩</span></button>
    <button class="b3d chico b-rojo" id="reiniciar" type="button" title="Reiniciar nivel" aria-label="Reiniciar nivel"><span class="b-ico">🔄</span></button>
  </div>
  <main class="zona">
    <section id="menu">
      <p id="menuInfo"></p>
      <button class="b3d txt b-verde" id="continuar" type="button">▶ Continuar</button>
      <button class="b3d txt b-azul" id="verMapa" type="button">🗺️ Niveles</button>
    </section>
    <section id="juego" hidden>
      <div class="fila" style="justify-content:center"><span class="chip" id="info"></span></div>
      <p id="pista"></p>
      <div id="mesa"></div>
      <div id="final" hidden>
        <b id="textoFinal"></b>
        <button class="b3d txt b-verde" id="siguiente" type="button">Siguiente nivel ▶</button>
      </div>
    </section>
  </main>
  <div id="mapa" hidden>
    <div class="mapa-caja">
      <div class="menu-cab">
        <button class="b3d txt chico b-gris" id="mapaAtras" type="button">← Atrás</button>
        <h2 id="mapaTitulo">Mapa</h2>
        <button class="b3d txt chico b-verde" id="mapaIr" type="button">📍 México</button>
      </div>
      <p id="mapaInfo"></p>
      <div id="mapaLienzo"></div>
    </div>
  </div>
  <script type="module" src="juego-botellascolores.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
  <script type="module" src="../compartido/fondo-madera.js"></script>
</body>
</html>
