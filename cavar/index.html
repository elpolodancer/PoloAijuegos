<!doctype html>
<!-- Ruta: cavar/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Cavar</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="icon" href="../iconos/icono-192.png" />
  <style>
    :root {
      --fondo: #1b2330; --panel: #232d3d; --borde: rgba(255,255,255,.14);
      --texto: #f6ecd9; --suave: #b9b2a3; --acento: #f2b441; --acento-t: #2a1c08; --malo: #ff6b5b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    #hud { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between;
      padding: calc(6px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) 6px calc(8px + env(safe-area-inset-left, 0px));
      background: var(--panel); border-bottom: 1px solid var(--borde); }
    .chips, .acciones { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .chip { position: relative; overflow: hidden; padding: 5px 10px; border: 1px solid var(--borde); border-radius: 10px;
      background: rgba(255,255,255,.06); font-size: .95rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chip b { font-weight: 700; }
    .chip small { color: var(--suave); margin-left: 4px; }
    #barraBolsa { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--acento); transition: width .15s; }
    #barraBolsa.llena { background: var(--malo); }
    button, .enlace { font: inherit; cursor: pointer; }
    .btn { padding: 7px 12px; border: 0; border-radius: 10px; background: var(--acento); color: var(--acento-t); font-weight: 700; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn2, .enlace { padding: 6px 10px; border: 1px solid var(--borde); border-radius: 10px; background: transparent; color: var(--texto); text-decoration: none; }
    button:focus-visible, .enlace:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #escena { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #lienzo { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
    #aviso { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -8px); max-width: 90%; padding: 8px 14px;
      border-radius: 12px; background: rgba(20,14,8,.88); border: 1px solid var(--acento); text-align: center; font-size: .95rem;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    #aviso.ver { opacity: 1; transform: translate(-50%, 0); }
    #pad { display: none; position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      width: 168px; height: 168px; grid-template: repeat(3, 1fr) / repeat(3, 1fr); touch-action: none; }
    @media (pointer: coarse) { #pad { display: grid; } }
    #pad button { border: 1px solid rgba(255,255,255,.3); background: rgba(27,35,48,.62); color: #fff; font-size: 22px;
      border-radius: 14px; margin: 2px; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #pad button.activo { background: rgba(242,180,65,.75); color: #2a1c08; }
    #pad .u { grid-area: 1 / 2; } #pad .l { grid-area: 2 / 1; } #pad .r { grid-area: 2 / 3; } #pad .d { grid-area: 3 / 2; }
    #panel { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(8,10,16,.6); }
    .hoja { width: min(560px, 100%); max-height: 88dvh; overflow-y: auto; padding: 14px 14px calc(16px + env(safe-area-inset-bottom, 0px));
      background: var(--panel); border: 1px solid var(--borde); border-radius: 18px 18px 0 0; }
    .hoja-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .hoja h2 { margin: 0; font-size: 1.25rem; }
    .hoja h3 { margin: 16px 0 6px; font-size: 1rem; color: var(--suave); font-weight: 600; }
    .fila { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--borde); }
    .fila:first-of-type { border-top: 0; }
    .fila .ico { font-size: 1.6rem; text-align: center; }
    .fila .det { font-size: .85rem; color: var(--suave); }
    .niveles { display: flex; gap: 3px; margin-top: 3px; }
    .niveles i { width: 14px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); }
    .niveles i.on { background: var(--acento); }
    .mins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .min { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 10px; font-size: .88rem; }
    .gema { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25), inset 2px 2px 0 rgba(255,255,255,.4); }
    .min small { display: block; color: var(--suave); }
    .pie { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--suave); font-size: .85rem; }
    @media (prefers-reduced-motion: reduce) { #aviso, #barraBolsa { transition: none; } }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="chips">
        <div class="chip">💰 <b id="dinero">$0</b></div>
        <div class="chip">⬇ <b id="prof">0 m</b></div>
        <div class="chip">🎒 <b id="bolsa">0/8</b><small id="bolsaValor">$0</small><i id="barraBolsa"></i></div>
      </div>
      <div class="acciones">
        <button class="btn2" id="btnCuerda" hidden>🪢 Subir</button>
        <button class="btn" id="btnMejoras">🧰 Mejoras</button>
        <button class="btn2" id="btnSonido" aria-label="Sonido">🔊</button>
        <a class="enlace" href="../" aria-label="Volver al portal">🏠</a>
      </div>
    </header>
    <main id="escena">
      <canvas id="lienzo" aria-label="Terreno con la zona de excavación"></canvas>
      <div id="aviso" role="status" aria-live="polite"></div>
      <div id="pad" aria-hidden="true">
        <button class="u" data-d="arriba" tabindex="-1">▲</button>
        <button class="l" data-d="izq" tabindex="-1">◀</button>
        <button class="r" data-d="der" tabindex="-1">▶</button>
        <button class="d" data-d="abajo" tabindex="-1">▼</button>
      </div>
    </main>
  </div>

  <div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitulo">
    <div class="hoja">
      <div class="hoja-cab">
        <h2 id="panelTitulo">Mejoras</h2>
        <button class="btn2" id="cerrarPanel" aria-label="Cerrar">✕</button>
      </div>
      <div id="panelCuerpo"></div>
    </div>
  </div>

  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
