<!doctype html>
<!-- Ruta: rana/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rana</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
    a.volver { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 5; padding: 6px 10px; background: rgba(15,18,32,.7); border-radius: 999px; font-size: .85rem; }
    #hud { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 5; padding: 6px 12px; background: rgba(15,18,32,.7); border-radius: 999px; font-size: .85rem; white-space: nowrap; }
    #fin { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgba(15,18,32,.9); overflow: auto; }
    #fin h2 { margin: 0; font-size: 1.8rem; }
    #fin p { margin: 0; max-width: 460px; color: var(--suave); }
    #niveles { display: grid; grid-template-columns: repeat(10, minmax(30px, 1fr)); gap: 5px; max-width: 460px; width: 100%; }
    #niveles .btn { padding: 6px 0; font-size: .8rem; opacity: .75; }
    #niveles .btn:disabled { opacity: .25; }
    #niveles .btn.sel { opacity: 1; outline: 2px solid #fff; outline-offset: 1px; }
    #msg { color: var(--suave); font-size: .85rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="volver" href="../">← Juegos</a>
  <div id="hud" hidden></div>
  <div id="fin">
    <h2>🐸 Rana</h2>
    <p id="texto">Cruza la carretera (y los ríos) hasta llegar arriba. Toca la pantalla para saltar adelante, o desliza el dedo hacia donde quieras ir (también flechas o WASD). Tienes 3 vidas por nivel.</p>
    <div id="niveles" role="group" aria-label="Nivel"></div>
    <div id="msg"></div>
    <button class="btn" id="jugar">Jugar</button>
  </div>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
