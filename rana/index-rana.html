<!doctype html>
<!-- Ruta: rana/index-rana.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rana</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    /* Juego de ventana completa */
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
    #fin { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; padding: calc(64px + env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom)); text-align: center; background: rgba(16,17,20,.92); overflow: auto; }
    #fin h2 { margin: 0; font-size: 1.8rem; }
    #fin p { margin: 0; max-width: 460px; color: var(--suave); }
    #niveles { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px 5px; max-width: 460px; width: 100%; padding-bottom: 5px; }
    #niveles .b3d { --t: 100%; width: 100%; height: auto; aspect-ratio: 1; margin: 0 0 4px; font-size: .78rem; font-weight: 800; border-radius: 9px; border-width: 1.5px; box-shadow: 0 3px 0 var(--c3), 0 5px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.55); }
    #niveles .b3d::before { display: none; }
    #niveles .b3d:disabled { opacity: .45; }
    #niveles .b3d.on { transform: translateY(3px); box-shadow: 0 0 0 2px #fff, 0 0 10px rgba(255,255,255,.55); }
    #msg { color: var(--suave); font-size: .85rem; min-height: 1.2em; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <canvas id="c"></canvas>
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver a Juegos" title="Juegos"><span class="b-ico">🏠</span></a>
  </div>
  <div class="hud hud-der"><span class="chip" id="hud" hidden></span></div>
  <div id="fin">
    <h2>🐸 Rana</h2>
    <p id="texto">Cruza la carretera (y los ríos) hasta llegar arriba. Toca la pantalla para saltar adelante, o desliza el dedo hacia donde quieras ir (también flechas o WASD). Tienes 3 vidas por nivel.</p>
    <div id="niveles" role="group" aria-label="Nivel"></div>
    <div id="msg"></div>
    <button class="b3d txt grande b-verde" id="jugar" type="button">Jugar</button>
  </div>
  <script type="module" src="juego-rana.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
