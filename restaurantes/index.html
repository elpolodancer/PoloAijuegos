<!doctype html>
<!-- Ruta: restaurantes/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Restaurantes</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    .lienzo { max-width: 760px; background: #8bbf6a; }
    .marcador { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; font-weight: 700; }
    .marcador span { color: var(--suave); }
    .marcador b { color: var(--texto); }
    #estado { min-height: 1.4em; margin: 6px 0; text-align: center; }
    .acciones { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .fin { margin: 14px auto 0; max-width: 420px; padding: 16px; text-align: center; background: var(--tarjeta); border: 1px solid var(--acento); border-radius: 16px; }
    .fin p { margin: 8px 0 12px; color: var(--suave); }
  </style>
</head>
<body>
  <header class="barra">
    <div>
      <a class="volver" href="../">← Juegos</a>
      <h1>🍽️ Restaurantes</h1>
    </div>
    <div id="sesion"></div>
  </header>
  <main>
    <div class="marcador">
      <span>💰 $<b id="dinero">0</b></span>
      <span>🎲 Tiradas <b id="tiradas">0</b>/3</span>
      <span>🏆 Récord $<b id="record">0</b></span>
    </div>
    <canvas id="lienzo" class="lienzo" width="720" height="480" aria-label="Restaurante en vista isométrica con cocina, baño, recepción y cuatro mesas"></canvas>
    <p id="estado">Tira el dado: llegarán 1, 2 o 4 clientes.</p>
    <div class="acciones">
      <button class="btn" id="dado">🎲 Tirar el dado</button>
      <button class="btn" id="reiniciar">Reiniciar</button>
    </div>
    <div id="fin" class="fin" hidden>
      <b id="finTitulo">Día terminado</b>
      <p id="finTexto"></p>
      <button class="btn" id="otra">Jugar otra vez</button>
    </div>
  </main>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
