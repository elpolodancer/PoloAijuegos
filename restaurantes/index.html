<!doctype html>
<!-- Ruta: restaurantes/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Restaurantes</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    .lienzo { max-width: 760px; background: #8bbf6a; }
    .marcador { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; font-weight: 700; }
    .marcador span { color: var(--suave); }
    .marcador b { color: var(--texto); }
    #estado { min-height: 1.4em; margin: 6px 0; text-align: center; }
    .acciones { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .tienda { position: fixed; z-index: 100; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 420px); padding: 14px; background: var(--tarjeta); border: 1px solid var(--acento); border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }
    .tienda-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .tienda-fila { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--borde); }
    .tienda-fila .ico { font-size: 1.8rem; }
    .tienda-fila .txt { flex: 1; }
    .tienda-fila small { display: block; color: var(--suave); }
  </style>
</head>
<body>
  <header class="barra">
    <div>
      <a class="volver" href="../">← Juegos</a>
      <h1>🍽️ Restaurantes</h1>
    </div>
    <div id="sesion"></div>
  </header>
  <main>
    <div class="marcador">
      <span>💰 $<b id="dinero">0</b> pesos</span>
      <span>⏱️ Jugando <b id="tiempo">0:00</b></span>
      <span>🏆 Récord $<b id="record">0</b> pesos</span>
    </div>
    <canvas id="lienzo" class="lienzo" width="720" height="480" aria-label="Restaurante en vista isométrica con cocina, baño, recepción y cuatro mesas; toca a los clientes que esperan para darles mesa"></canvas>
    <p id="estado">Los clientes llegan solos: toca a la familia en la recepción para darles mesa. Toca el mostrador 🛒 para contratar personal.</p>
    <div class="acciones">
      <button class="btn" id="alejar" aria-label="Alejar" title="Alejar">➖</button>
      <button class="btn" id="acercar" aria-label="Acercar" title="Acercar">➕</button>
      <button class="btn" id="centrar" aria-label="Centrar la vista" title="Centrar la vista">🎯</button>
      <button class="btn" id="reiniciar">Reiniciar</button>
    </div>
  </main>
  <div id="tienda" class="tienda" role="dialog" aria-label="Tienda: personal, mesas, sillas y mejoras" hidden>
    <div class="tienda-cab">
      <b>🛒 Tienda</b>
      <span>💰 $<b id="tiendaDinero">0</b> pesos</span>
      <button class="btn" id="cerrarTienda">Cerrar</button>
    </div>
    <div id="tiendaLista"></div>
  </div>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
