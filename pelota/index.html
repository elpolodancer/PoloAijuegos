<!doctype html>
<!-- Ruta: pelota/index.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pelota</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
    a.volver { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 5; padding: 6px 10px; background: rgba(15,18,32,.7); border-radius: 999px; font-size: .85rem; }
    #hud { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 5; padding: 6px 12px; background: rgba(15,18,32,.7); border-radius: 999px; font-size: .85rem; white-space: nowrap; }
    .ctl { position: fixed; z-index: 6; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(27,35,48,.55); color: #fff; font-size: 28px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .ctl:active, .ctl.on { background: rgba(124,92,255,.8); }
    #izq { left: calc(14px + env(safe-area-inset-left, 0px)); }
    #der { left: calc(92px + env(safe-area-inset-left, 0px)); }
    #salto { right: calc(64px + env(safe-area-inset-right, 0px)); width: 78px; height: 78px; }
    @media (hover: hover) and (pointer: fine) { .ctl { display: none; } }
    #fin { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgba(15,18,32,.88); }
    #fin h2 { margin: 0; font-size: 1.8rem; }
    #fin p { margin: 0; max-width: 460px; color: var(--suave); }
    #niveles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #niveles .btn { min-width: 44px; opacity: .6; }
    #niveles .btn.sel { opacity: 1; outline: 2px solid #fff; outline-offset: 2px; }
    #msg { color: var(--suave); font-size: .85rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="volver" href="../">← Juegos</a>
  <div id="hud" hidden></div>
  <button class="ctl" id="izq" aria-label="Izquierda">◀</button>
  <button class="ctl" id="der" aria-label="Derecha">▶</button>
  <button class="ctl" id="salto" aria-label="Saltar">⤒</button>
  <div id="fin">
    <h2>🔴 Pelota</h2>
    <p id="texto">Rueda con ◀ ▶ (o flechas / A D) y brinca con ⤒ (o espacio). Empuja las cajas y salta sobre los monstruos para aplastarlos. Llega a la bandera.</p>
    <div id="niveles" role="group" aria-label="Nivel"></div>
    <div id="msg"></div>
    <button class="btn" id="jugar">Jugar</button>
  </div>
  <script type="module" src="juego.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
