<!doctype html>
<!-- Ruta: pelota/index-pelota.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pelota</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    /* Juego de ventana completa: el lienzo ocupa toda la pantalla */
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }

    /* Controles táctiles flotantes (se ocultan en PC con teclado) */
    .ctl-wrap { position: fixed; z-index: 6; display: flex; gap: 12px; pointer-events: none; touch-action: none; bottom: max(14px, env(safe-area-inset-bottom)); }
    .ctl-wrap > * { pointer-events: auto; touch-action: none; }
    .ctl-izq { left: max(10px, env(safe-area-inset-left)); }
    .ctl-der { right: calc(64px + env(safe-area-inset-right, 0px)); } /* deja libre el botón ⛶ de la esquina */
    @media (hover: hover) and (pointer: fine) { .ctl-wrap { display: none; } }
    /* Mientras se ve el menú, los controles no estorban */
    #fin:not([hidden]) ~ .ctl-wrap { display: none; }

    /* Menú / fin de nivel: capa con scroll interno, deja libres los botones flotantes de arriba */
    #fin { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: auto;
      padding: calc(64px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; background: rgba(16,17,20,.9); }
    #fin h2 { margin: 0; font-size: 1.8rem; }
    #fin p { margin: 0; max-width: 460px; color: var(--suave); }
    #niveles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-bottom: 5px; }
    #msg { color: var(--suave); font-size: .85rem; min-height: 1.2em; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <canvas id="c"></canvas>

  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver a Juegos" title="Juegos"><span class="b-ico">🏠</span></a>
    <span class="chip" id="hud" hidden></span>
  </div>

  <div id="fin">
    <h2>🔴 Pelota</h2>
    <p id="texto">Rueda con ◀ ▶ (o flechas / A D) y brinca con ⤒ (o espacio). Empuja las cajas y salta sobre los monstruos para aplastarlos. Llega a la bandera.</p>
    <div id="niveles" role="group" aria-label="Nivel"></div>
    <div id="msg"></div>
    <button class="b3d txt grande b-verde" id="jugar" type="button">Jugar</button>
  </div>

  <div class="ctl-wrap ctl-izq">
    <button class="b3d grande b-azul" id="izq" type="button" aria-label="Izquierda" title="Izquierda"><span class="b-ico">◀</span></button>
    <button class="b3d grande b-azul" id="der" type="button" aria-label="Derecha" title="Derecha"><span class="b-ico">▶</span></button>
  </div>
  <div class="ctl-wrap ctl-der">
    <button class="b3d grande b-oro" id="salto" type="button" aria-label="Saltar" title="Saltar"><span class="b-ico">⤒</span></button>
  </div>

  <script type="module" src="juego-pelota.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
