<!doctype html>
<!-- Ruta: jetpack/index-jetpack.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Jetpack</title>
  <meta name="theme-color" content="#101114" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    /* Juego horizontal (800×400): el marco se ajusta al ancho o al alto de la ventana */
    .inmersivo .marco { aspect-ratio: 2 / 1;
      width: min(100vw, calc(100vh * 2));
      width: min(100vw, calc(100dvh * 2)); }
    .inmersivo .lienzo { user-select: none; -webkit-user-select: none; touch-action: none; }
    /* Los marcadores del juego se dibujan en las esquinas del lienzo: los botones van abajo */
    .hud-abajo { flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 80px); }
    #info { height: auto; min-height: 30px; padding: 4px 10px; max-width: 60vw; font-size: 12px; font-weight: 700; line-height: 1.25; white-space: normal; color: #e3e5ea; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <div class="escena">
    <div class="marco"><canvas id="lienzo" class="lienzo"></canvas></div>
  </div>
  <div class="hud hud-abajo">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal" title="Volver al portal"><span class="b-ico">🏠</span></a>
    <div id="sesion" style="display:flex;align-items:center;gap:8px"></div>
    <span class="chip" id="info"></span>
  </div>
  <script type="module" src="juego-jetpack.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
