<!doctype html>
<!-- Ruta: defendercastillo/index-defendercastillo.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Defensa del castillo</title>
  <meta name="theme-color" content="#15161a" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    .b3d:disabled { filter: grayscale(.85) brightness(.7); }
    .b-info:empty { display: none; }

    /* ----- Marco del juego (360×540 = 2:3). Celular horizontal / PC: ocupa toda la altura ----- */
    .inmersivo .marco { aspect-ratio: 2 / 3; width: min(100vw, calc(100vh * 2 / 3)); width: min(100vw, calc(100dvh * 2 / 3)); }
    .inmersivo .lienzo { background: #2f5d34; }

    /* ----- Textos flotantes ----- */
    .hud-izq { flex-wrap: wrap; gap: 4px 8px; max-width: calc(100vw - 80px); }
    #mapaNombre { flex-basis: 100%; font-size: 12px; color: #d8dbe2; text-shadow: 0 1px 2px #000; }
    #mapaNombre:empty { display: none; }
    #estado { position: absolute; left: 6px; right: 6px; top: 6px; z-index: 2; padding: 4px 8px; font-size: 11px; line-height: 1.3; text-align: center; color: #fff;
      background: rgba(10,10,12,.62); border-radius: 10px; pointer-events: none; }
    #estado:empty { display: none; }

    /* ----- Tienda de torres: el color indica lo cara y poderosa que es ----- */
    #tienda { position: fixed; z-index: 5; display: flex; gap: 10px; left: max(8px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); flex-direction: column; }
    #controles { position: fixed; z-index: 5; display: grid; grid-template-columns: repeat(2, auto); gap: 8px 10px; right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
    #btnOleada { --t: 52px; }

    /* ----- Panel de la torre elegida (arriba o abajo, según dónde esté la torre) ----- */
    #panel { position: absolute; left: 6px; right: 6px; top: 6px; z-index: 3; padding: 8px; font-size: .82rem; background: rgba(20,21,24,.95); border: 2px solid #15171a; border-radius: 14px; box-shadow: 0 4px 0 #0c0d0f; }
    #panel.abajo { top: auto; bottom: 6px; }
    #panel .cab { display: flex; align-items: center; gap: 8px; }
    #panel .ico { display: grid; place-items: center; width: 32px; height: 32px; font-size: 1.1rem; border-radius: 50%; background: var(--c, #444); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
    #panel .nom { font-weight: 700; }
    #panel .pips { margin-left: auto; color: #ffd34d; letter-spacing: 3px; }
    #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    #panel .dato { padding: 2px 8px; font-size: .72rem; background: #2b2f35; border: 1px solid var(--borde); border-radius: 999px; }
    #panel .dato em { font-style: normal; font-weight: 700; color: #7dff9a; }
    #panel .fila { display: flex; gap: 8px; margin-top: 8px; }
    #panel .fila .b3d { flex: 1; --t: 38px; font-size: 13px; }

    /* ----- Menú de mapas y pantalla final (dentro del marco) ----- */
    #menu { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(10,10,12,.96); overflow-y: auto; }
    #menu h2 { margin: 0; text-align: center; font-size: 1.25rem; }
    #menuLista { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .b3d.mapa { --t: 56px; height: auto; min-height: var(--t); flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; text-align: left; white-space: normal; font-size: 13px; }
    .b3d.mapa small { font-size: 11px; font-weight: 600; opacity: .9; }
    #fin { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgba(10,10,12,.88); }
    #fin h2 { margin: 0; font-size: 1.5rem; }
    #fin p { margin: 0; color: var(--suave); }
    #estrellas { font-size: 2rem; letter-spacing: 4px; }

    /* ----- Celular vertical: tienda y controles en filas abajo; el marco se achica para dejarles sitio ----- */
    @media (orientation: portrait) {
      .escena { padding: calc(62px + env(safe-area-inset-top, 0px)) 0 calc(140px + env(safe-area-inset-bottom, 0px)); }
      .inmersivo .marco { width: min(100vw, calc((100vh - 202px) * 2 / 3)); width: min(100vw, calc((100dvh - 202px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 2 / 3)); aspect-ratio: 2 / 3; height: auto; }
      #tienda { left: 0; right: 0; top: auto; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); transform: none; flex-direction: row; justify-content: center; }
      #controles { left: 8px; right: auto; top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: none; display: flex; gap: 8px; }
      #record { display: none; }
    }
    @media (max-height: 420px) { #tienda, #controles { gap: 6px 8px; } #tienda .b3d { --t: 38px; } }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="360" height="540"></canvas>
      <div id="estado"></div>
      <div id="panel" hidden></div>
      <div id="menu">
        <h2>🗺️ Elige un mapa</h2>
        <div id="menuLista"></div>
      </div>
      <div id="fin" hidden>
        <h2 id="finTitulo"></h2>
        <div id="estrellas"></div>
        <p id="finTexto"></p>
        <button class="b3d txt b-verde" id="finReintentar" type="button">Jugar de nuevo</button>
        <button class="b3d txt b-azul" id="finSiguiente" type="button" hidden>Siguiente mapa ▶</button>
        <button class="b3d txt b-gris" id="finMapas" type="button">🗺️ Mapas</button>
      </div>
    </div>
  </div>

  <!-- Capas flotantes -->
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal" title="Volver al portal"><span class="b-ico">🏠</span></a>
    <span class="chip">🪙 <b id="oro">0</b></span>
    <span class="chip">❤️ <b id="vida">0</b></span>
    <span class="chip">🌊 <b id="oleada">1</b></span>
    <span class="chip" id="record"></span>
    <div id="mapaNombre"></div>
  </div>
  <div class="hud hud-der">
    <button class="b3d chico b-gris" id="btnSonido" type="button" aria-label="Sonido" title="Sonido"><span class="b-ico">🔊</span></button>
  </div>
  <div id="tienda" role="group" aria-label="Torres"></div>
  <div id="controles">
    <button class="b3d b-verde" id="btnOleada" type="button" aria-label="Empezar oleada" title="Empezar oleada"><span class="b-ico" id="btnOleadaIco">▶</span><span class="b-info" id="btnOleadaNum"></span></button>
    <button class="b3d chico b-oro" id="btnMeteoro" type="button" aria-label="Meteoro" title="Meteoro"><span class="b-ico">☄️</span><span class="b-info" id="btnMeteoroNum"></span></button>
    <button class="b3d chico b-rojo" id="btnQuitar" type="button" aria-label="Quitar: talar o vender" title="Quitar: talar árboles o vender torres"><span class="b-ico">🪓</span></button>
    <button class="b3d chico b-azul" id="btnMapas" type="button" aria-label="Mapas" title="Mapas"><span class="b-ico">🗺️</span></button>
    <button class="b3d chico b-morado" id="btnVel" type="button" aria-label="Velocidad" title="Velocidad"><span class="b-ico">⏩</span><span class="b-info" id="velNum">x1</span></button>
    <button class="b3d chico b-gris" id="btnPausa" type="button" aria-label="Pausa" title="Pausa"><span class="b-ico">⏸</span></button>
  </div>
  <script type="module" src="juego-defendercastillo.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
