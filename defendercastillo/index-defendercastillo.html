<!doctype html>
<!-- Ruta: defendercastillo/index-defendercastillo.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Defensa del castillo</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    .titulo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #mapaNombre { text-align: center; color: var(--suave); font-size: .85rem; margin-top: 6px; }
    #hud { display: flex; justify-content: center; gap: 18px; margin: 4px 0 8px; font-size: 1.05rem; }
    .marco { position: relative; max-width: 420px; margin: 0 auto; }
    .marco .lienzo { margin: 0; background: #2f5d34; }
    #fin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; text-align: center; background: rgba(15, 18, 32, .86); border-radius: 16px; }
    #fin h2 { margin: 0; font-size: 1.6rem; }
    #fin p { margin: 0; color: var(--suave); }
    #estrellas { font-size: 2rem; letter-spacing: 4px; }
    #estado { max-width: 420px; min-height: 2.6em; margin: 8px auto; text-align: center; font-size: .9rem; }
    /* ----- Tienda de torres ----- */
    #tienda { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 420px; margin: 0 auto; }
    .tor { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; font-size: .74rem; background: linear-gradient(180deg, #252c4b, var(--tarjeta)); border: 2px solid var(--borde); border-radius: 12px; transition: transform .12s, border-color .12s, box-shadow .12s; }
    .tor .ico { display: grid; place-items: center; width: 38px; height: 38px; font-size: 1.35rem; line-height: 1; border-radius: 50%; background: var(--c, #444); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 0 0 2px rgba(255, 255, 255, .12); }
    .tor small { padding: 1px 7px; font-size: .7rem; font-weight: 700; color: #ffe27a; background: rgba(0, 0, 0, .3); border-radius: 999px; }
    .tor.sel { border-color: #ffd34d; background: #2b3157; transform: translateY(-3px); box-shadow: 0 6px 14px rgba(255, 211, 77, .25); }
    .tor.caro { opacity: .55; }
    .tor.caro small { color: #ff8a8a; }
    .tor:active { transform: scale(.96); }
    /* ----- Panel de la torre elegida ----- */
    #panel { max-width: 420px; margin: 10px auto 0; padding: 10px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; font-size: .9rem; }
    #panel .cab { display: flex; align-items: center; gap: 10px; }
    #panel .ico { display: grid; place-items: center; width: 34px; height: 34px; font-size: 1.2rem; border-radius: 50%; background: var(--c, #444); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
    #panel .nom { font-weight: 700; font-size: 1rem; }
    #panel .pips { margin-left: auto; color: #ffd34d; letter-spacing: 3px; }
    #panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #panel .chip { padding: 3px 9px; font-size: .8rem; background: #11152a; border: 1px solid var(--borde); border-radius: 999px; }
    #panel .chip em { font-style: normal; font-weight: 700; color: #7dff9a; }
    #panel .fila { display: flex; gap: 8px; margin-top: 10px; }
    #panel .btn { flex: 1; }
    .sec { background: #4a5070; }
    /* ----- Botones de control ----- */
    #controles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 420px; margin: 12px auto 0; }
    #controles .btn { padding: 11px 6px; font-size: .9rem; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); transition: transform .08s, filter .12s; }
    #controles .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .25); }
    #controles #btnOleada { grid-column: 1 / -1; padding: 14px; font-size: 1.1rem; letter-spacing: .3px; background: linear-gradient(180deg, #2fbf71, #1f9d55); }
    #controles #btnOleada:not(:disabled) { animation: latido 1.8s ease-in-out infinite; }
    #controles #btnOleada:disabled { background: #4a5070; }
    @keyframes latido { 50% { box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 0 0 5px rgba(47, 191, 113, .3); } }
    /* El meteoro se va llenando mientras se recarga (juego-defendercastillo.js mueve --carga de 0 a 100 %) */
    #controles #btnMeteoro { background: linear-gradient(90deg, #d9631e var(--carga, 100%), #4a5070 var(--carga, 100%)); }
    #controles #btnMeteoro:disabled { opacity: .9; }
    #btnMeteoro.sel, #btnQuitar.sel { outline: 2px solid #ffd34d; }
    @media (prefers-reduced-motion: reduce) { #controles #btnOleada:not(:disabled) { animation: none; } .tor { transition: none; } }
    #menu { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(15, 18, 32, .96); border-radius: 16px; overflow-y: auto; }
    #menu h2 { margin: 0; text-align: center; font-size: 1.3rem; }
    #menuLista { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mapa { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px; text-align: left; background: var(--tarjeta); border: 1px solid var(--borde); }
    .mapa small { color: var(--suave); font-weight: 400; }
  </style>
</head>
<body>
  <header class="barra">
    <div class="titulo">
      <a class="volver" href="../">← Juegos</a>
      <h1>🏰 Defensa del castillo</h1>
    </div>
    <span id="record" style="color:var(--suave);font-size:.85rem"></span>
  </header>
  <main>
    <div id="mapaNombre"></div>
    <div id="hud">
      <span>🪙 <b id="oro">0</b></span>
      <span>❤️ <b id="vida">0</b></span>
      <span>🌊 <b id="oleada">1</b></span>
    </div>
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="360" height="540"></canvas>
      <div id="menu">
        <h2>🗺️ Elige un mapa</h2>
        <div id="menuLista"></div>
      </div>
      <div id="fin" hidden>
        <h2 id="finTitulo"></h2>
        <div id="estrellas"></div>
        <p id="finTexto"></p>
        <button class="btn" id="finReintentar">Jugar de nuevo</button>
        <button class="btn" id="finSiguiente" hidden>Siguiente mapa ▶</button>
        <button class="btn sec" id="finMapas">🗺️ Mapas</button>
      </div>
    </div>
    <p id="estado"></p>
    <div id="tienda"></div>
    <div id="panel" hidden></div>
    <div id="controles">
      <button class="btn" id="btnOleada">▶ Empezar oleada</button>
      <button class="btn sec" id="btnMeteoro">☄️ Meteoro</button>
      <button class="btn sec" id="btnQuitar">🪓 Quitar</button>
      <button class="btn sec" id="btnMapas">🗺️ Mapas</button>
      <button class="btn sec" id="btnVel">⏩ x1</button>
      <button class="btn sec" id="btnPausa">⏸ Pausa</button>
      <button class="btn sec" id="btnSonido">🔊</button>
    </div>
  </main>
  <script type="module" src="juego-defendercastillo.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
