<!doctype html>
<!-- Ruta: defendercastillo/index-defendercastillo.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Defensa del castillo</title>
  <meta name="theme-color" content="#15161a" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #101114; }
    .b3d:disabled { filter: grayscale(.85) brightness(.7); }
    .b-info:empty { display: none; }
    /* Billete verde (dibujado en juego-defendercastillo.js): se escala con el tamaño del texto donde esté */
    .bill { display: inline-block; width: 1.6em; height: 1em; vertical-align: -.2em; margin: 0 1px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.45)); pointer-events: none; }
    .b3d.stat .b-ico .bill { display: block; }

    /* ----- Marco del juego: toma la proporción del mapa (--asp = columnas / filas, la pone juego-defendercastillo.js; 2:3 si aún no hay mapa).
       Los mapas van de 12×18 a 30×30. Celular horizontal / PC: ocupa toda la altura ----- */
    .inmersivo .marco { aspect-ratio: var(--asp, 0.6667); height: auto; width: min(100vw, calc((100vh - var(--res-arriba) - var(--res-abajo)) * var(--asp, 0.6667))); width: min(100vw, calc((100dvh - var(--res-arriba) - var(--res-abajo)) * var(--asp, 0.6667))); }
    .inmersivo .lienzo { background: #2f5d34; }

    /* ----- Marcadores (monedas, vida, oleada): 3 botones cuadrados 3D, iguales a los del dock -----
       Celular: en fila arriba a la izquierda. PC / pantalla ancha: en columna pegados al borde izquierdo del mapa (--mw = ancho del marco) */
    #stats { display: flex; align-items: center; gap: 8px; }
    /* --base / --ico / --num = tamaño de los botones de vida y oleada; el del dinero (.dinero) es 25 % más grande en todo */
    .b3d.stat { --base: 40px; --ico: 15px; --num: 12px; --k: 1; --t: calc(var(--base) * var(--k)); width: auto; min-width: var(--t); padding: 0 4px; flex-direction: column; gap: 2px; font-weight: 800; cursor: default; pointer-events: none; }
    .b3d.stat.dinero { --k: 1.25; }
    .b3d.stat .b-ico { font-size: calc(var(--ico) * var(--k)); line-height: 1; }
    .b3d.stat b { position: relative; font-size: calc(var(--num) * var(--k)); line-height: 1; font-variant-numeric: tabular-nums; }
    @media (min-aspect-ratio: 4/3) {
      body { --mw: min(100vw, calc((100dvh - var(--res-arriba) - var(--res-abajo)) * var(--asp, 0.6667))); }
      #stats { position: fixed; top: calc(var(--res-arriba) + 6px); right: calc(50vw + var(--mw) / 2 + 12px); flex-direction: column; align-items: flex-end; gap: 8px; }
      .b3d.stat { --base: 66px; --ico: 25px; --num: 16px; }
    }
    @media (min-aspect-ratio: 4/3) and (max-height: 520px) {
      .b3d.stat { --base: 46px; --ico: 18px; --num: 13px; }
    }

    /* ----- Textos flotantes ----- */
    .hud-izq { flex-wrap: wrap; gap: 4px 8px; max-width: calc(100vw - 80px); }
    #mapaNombre { flex-basis: 100%; font-size: 12px; color: #d8dbe2; text-shadow: 0 1px 2px #000; }
    #mapaNombre:empty { display: none; }
    /* Texto de ayuda: FUERA del mapa. Vertical: línea arriba de los botones del dock (su espacio está reservado en --res-abajo, así el mapa no salta).
       Horizontal / PC: panel a la derecha del mapa (ver más abajo) */
    #estado { order: -1; align-self: center; width: min(100%, 440px); min-height: 34px; display: flex; align-items: center; justify-content: center; padding: 4px 10px; font-size: 11px; line-height: 1.3; text-align: center; color: #e6e8ec;
      background: rgba(0,0,0,.35); border-radius: 10px; pointer-events: none; }
    #estado:empty { visibility: hidden; }

    /* ----- Dock inferior (como las cartas de Clash Royale): torres arriba y acciones debajo, todo junto abajo del mapa.
       El marco del juego se recorre hacia arriba para dejarle sitio (--res-arriba / --res-abajo = espacio reservado) ----- */
    :root { --res-arriba: calc(62px + env(safe-area-inset-top, 0px)); --res-abajo: calc(192px + env(safe-area-inset-bottom, 0px)); }
    .escena { padding: var(--res-arriba) 0 var(--res-abajo); }
    #dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 14px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, #2c2f36, #17181c);
      border-top: 3px solid #0c0d0f; box-shadow: 0 -6px 16px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08); }
    #tienda, #controles { display: flex; align-items: center; justify-content: center; gap: 10px; }   /* tienda: el color indica lo cara y poderosa que es la torre */
    #controles { gap: 8px; }
    #btnOleada { --t: 52px; }

    /* ----- Panel de la torre elegida (arriba o abajo, según dónde esté la torre) ----- */
    #panel { position: absolute; left: 6px; right: 6px; top: 6px; z-index: 3; padding: 8px; font-size: .82rem; background: rgba(20,21,24,.95); border: 2px solid #15171a; border-radius: 14px; box-shadow: 0 4px 0 #0c0d0f; }
    #panel.abajo { top: auto; bottom: 6px; }
    #panel .cab { display: flex; align-items: center; gap: 8px; }
    #panel .ico { display: grid; place-items: center; width: 32px; height: 32px; font-size: 1.1rem; border-radius: 50%; background: var(--c, #444); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
    #panel .nom { font-weight: 700; }
    #panel .pips { margin-left: auto; color: #ffd34d; letter-spacing: 3px; }
    #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    #panel .dato { padding: 2px 8px; font-size: .72rem; background: #2b2f35; border: 1px solid var(--borde); border-radius: 999px; }
    #panel .dato em { font-style: normal; font-weight: 700; color: #7dff9a; }
    #panel .fila { display: flex; gap: 8px; margin-top: 8px; }
    #panel .fila .b3d { flex: 1; --t: 38px; font-size: 13px; }

    /* ----- Menú de mapas y pantalla final (dentro del marco) ----- */
    #menu { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(10,10,12,.96); overflow-y: auto; }
    #menu h2 { margin: 0; text-align: center; font-size: 1.25rem; }
    #menuLista { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .b3d.mapa { --t: 56px; height: auto; min-height: var(--t); flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 12px; text-align: left; white-space: normal; font-size: 13px; }
    .b3d.mapa small { font-size: 11px; font-weight: 600; opacity: .9; }
    #menuPest { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    #menuInfo { font-size: 11px; line-height: 1.35; text-align: center; color: var(--suave); }
    #menuLista.mich { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .b3d.nvl { --t: 46px; width: 100%; height: 50px; margin: 0 0 5px; flex-direction: column; gap: 0; font-size: 16px; font-weight: 800; }
    .b3d.nvl .b-ico { font-size: 16px; }
    .b3d.nvl small { font-size: 9px; line-height: 9px; min-height: 9px; }
    .b3d.nvl .b-info { font-size: 12px; padding: 0 4px; min-width: 20px; }
    #fin { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding: 20px; overflow-y: auto; text-align: center; background: rgba(10,10,12,.88); }
    #fin > :first-child { margin-top: auto; }   /* centrado vertical que, si no cabe (celular acostado), se desplaza en vez de cortarse */
    #fin > :last-child { margin-bottom: auto; }
    #fin h2 { margin: 0; font-size: 1.5rem; }
    #fin p { margin: 0; color: var(--suave); }
    #estrellas { font-size: 2rem; letter-spacing: 4px; }

    /* Muchas torres (Michoacán llega a 10): botones más chicos, en dos filas, y el dock reserva más alto */
    body.muchas { --res-abajo: calc(236px + env(safe-area-inset-bottom, 0px)); }
    body.muchas #tienda { flex-wrap: wrap; max-width: 330px; gap: 8px 7px; }
    body.muchas #tienda .b3d { --t: 40px; }
    body.muchas .escena { padding-bottom: var(--res-abajo); }

    /* Horizontal / PC: el texto de ayuda va en un panel a la derecha del mapa (no tapa nada); --mw = ancho del marco */
    @media (orientation: landscape) {
      body { --mw: min(100vw, calc((100dvh - var(--res-arriba) - var(--res-abajo)) * var(--asp, 0.6667))); }
      #estado { position: fixed; order: 0; top: calc(var(--res-arriba) + 54px); left: calc(50vw + var(--mw) / 2 + 12px); width: min(260px, calc(50vw - var(--mw) / 2 - 24px)); min-height: 0; max-height: 50dvh; overflow: hidden;
        justify-content: flex-start; padding: 8px 10px; font-size: 13px; text-align: left; background: rgba(20,21,24,.85); border: 2px solid #15171a; border-radius: 14px; }
      #estado:empty { display: none; }
    }
    @media (orientation: landscape) and (max-height: 520px) { #estado { font-size: 11px; padding: 6px 8px; } }

    /* ----- Horizontal (celular acostado / PC): el dock queda en una sola fila abajo y el mapa ocupa casi toda la altura ----- */
    @media (orientation: landscape) {
      body.muchas { --res-abajo: calc(88px + env(safe-area-inset-bottom, 0px)); }
      body.muchas #tienda { flex-wrap: nowrap; max-width: none; gap: 4px; }
      body.muchas #tienda .b3d { --t: 36px; }
      :root { --res-arriba: calc(8px + env(safe-area-inset-top, 0px)); --res-abajo: calc(88px + env(safe-area-inset-bottom, 0px)); }
      #dock { flex-direction: row; justify-content: center; gap: 24px; padding: 14px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
      #record { display: none; }
    }
    /* Celular acostado: botones un poco más chicos y marcadores en una columna a la izquierda (así no tapan el mapa) */
    @media (orientation: landscape) and (max-height: 520px) {
      :root { --res-abajo: calc(76px + env(safe-area-inset-bottom, 0px)); }
      #dock { gap: 18px; padding-top: 12px; }
      #tienda { gap: 8px; } #controles { gap: 6px; }
      #tienda .b3d, #btnOleada { --t: 44px; }
      #controles .b3d.chico { --t: 36px; }
      .hud-izq { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; gap: 5px; max-width: none; }
      #mapaNombre { flex-basis: auto; max-width: 78px; }
    }
    @media (orientation: landscape) and (max-width: 620px) {
      #dock { gap: 10px; padding-left: 4px; padding-right: 4px; }
      #tienda { gap: 5px; } #controles { gap: 4px; }
      #tienda .b3d, #btnOleada { --t: 38px; }
      #controles .b3d.chico { --t: 32px; }
    }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto>
  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="360" height="540"></canvas>
      <div id="panel" hidden></div>
      <div id="menu">
        <h2>🗺️ Elige un mapa</h2>
        <div id="menuPest">
          <button class="b3d txt chico b-gris" id="pestMich" type="button">📍 Michoacán · 10</button>
          <button class="b3d txt chico b-gris" id="pestClasicos" type="button">🔓 Desbloqueados</button>
        </div>
        <div id="menuInfo"></div>
        <div id="menuLista"></div>
      </div>
      <div id="fin" hidden>
        <h2 id="finTitulo"></h2>
        <div id="estrellas"></div>
        <p id="finTexto"></p>
        <button class="b3d txt b-verde" id="finReintentar" type="button">Jugar de nuevo</button>
        <button class="b3d txt b-azul" id="finSiguiente" type="button" hidden>Siguiente mapa ▶</button>
        <button class="b3d txt b-gris" id="finMapas" type="button">🗺️ Mapas</button>
      </div>
    </div>
  </div>

  <!-- Capas flotantes -->
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal" title="Volver al portal"><span class="b-ico">🏠</span></a>
    <button class="b3d chico b-azul" id="btnAtras" type="button" aria-label="Volver a los mapas" title="Volver a los mapas"><span class="b-ico">◀</span></button>
    <div id="stats" role="group" aria-label="Dinero, vida y oleada">
      <div class="b3d stat dinero b-oro" title="Dinero"><span class="b-ico">💵</span><b id="oro">0</b></div>
      <div class="b3d stat b-rojo" title="Vida del castillo"><span class="b-ico">❤️</span><b id="vida">0</b></div>
      <div class="b3d stat b-azul" title="Oleada"><span class="b-ico">👹</span><b id="oleada">1</b></div>
    </div>
    <span class="chip" id="record"></span>
    <div id="mapaNombre"></div>
  </div>
  <div class="hud hud-der">
    <button class="b3d chico b-gris" id="btnSonido" type="button" aria-label="Sonido" title="Sonido"><span class="b-ico">🔊</span></button>
  </div>
  <!-- Dock inferior: torres y acciones -->
  <div id="dock">
    <div id="estado" role="status" aria-live="polite"></div>
    <div id="tienda" role="group" aria-label="Torres"></div>
    <div id="controles" role="group" aria-label="Acciones">
      <button class="b3d b-verde" id="btnOleada" type="button" aria-label="Empezar oleada" title="Empezar oleada"><span class="b-ico" id="btnOleadaIco">▶</span><span class="b-info" id="btnOleadaNum"></span></button>
      <button class="b3d chico b-oro" id="btnMeteoro" type="button" aria-label="Meteoro" title="Meteoro"><span class="b-ico">☄️</span><span class="b-info" id="btnMeteoroNum"></span></button>
      <button class="b3d chico b-rojo" id="btnQuitar" type="button" aria-label="Quitar: talar o vender" title="Quitar: talar árboles o vender torres"><span class="b-ico">🪓</span></button>
      <button class="b3d chico b-morado" id="btnVel" type="button" aria-label="Velocidad (x1 a x8)" title="Velocidad: x1 a x8"><span class="b-ico">⏩</span><span class="b-info" id="velNum">x1</span></button>
      <button class="b3d chico b-gris" id="btnPausa" type="button" aria-label="Pausa" title="Pausa"><span class="b-ico">⏸</span></button>
      <button class="b3d chico b-azul" id="btnMapas" type="button" aria-label="Mapas" title="Mapas"><span class="b-ico">🗺️</span></button>
    </div>
  </div>
  <script type="module" src="juego-defendercastillo.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
