<!doctype html>
<!-- Ruta: fate/index-fate.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Aldea y Mazmorra</title>
  <meta name="theme-color" content="#14111a" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    html.inmersivo { --fondo-juego: #14111a; }
    .inmersivo .lienzo { background: #14111a; cursor: pointer; }
    .hud-izq { flex-wrap: wrap; gap: 4px 8px; max-width: calc(100vw - 150px); }
    /* Barras de vida, maná y experiencia (arriba a la derecha) */
    .barras { display: flex; flex-direction: column; gap: 4px; width: min(32vw, 130px); }
    .bv { position: relative; height: 14px; overflow: hidden; background: #15171a; border: 2px solid #15171a; border-radius: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.5); }
    .bv i { display: block; height: 100%; width: 100%; transition: width .15s; }
    .bv span { position: absolute; inset: 0; font-size: 9px; font-weight: 800; line-height: 14px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
    .bv.hp i { background: linear-gradient(#ff9a9a, #e03a3a); }
    .bv.mp i { background: linear-gradient(#9ad0ff, #2f7bd6); }
    .bv.xp i { background: linear-gradient(#ffe58a, #d9a010); }
    .bv.xp { height: 10px; } .bv.xp span { line-height: 10px; font-size: 8px; }
    /* Panel de diálogo, tienda y misiones (dentro del marco) */
    #dialogo { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(8, 6, 12, .75); }
    #dialogo[hidden] { display: none; }
    .caja { width: 100%; max-width: 470px; max-height: 100%; overflow-y: auto; padding: 12px 14px; font-size: .88rem; line-height: 1.35; background: #25202e; border: 3px solid #0f0d14; border-radius: 16px; box-shadow: 0 5px 0 #0f0d14; }
    .caja h3 { margin: 0 0 6px; font-size: 1.1rem; } .caja h3 small { font-weight: 400; color: var(--suave); font-size: .75rem; }
    .caja p { margin: 4px 0 8px; } .caja .pista { color: #ffe27a; } .caja .cuenta { color: var(--suave); font-size: .78rem; }
    .caja .mis { padding: 8px 0; border-top: 1px solid var(--borde); } .caja .mis small { color: var(--suave); }
    .caja .fila { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .caja .b3d { margin-top: 4px; }
  </style>
</head>
<body class="inmersivo">
  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="640" height="480" aria-label="Aldea y Mazmorra"></canvas>
      <div id="dialogo" hidden></div>
    </div>
  </div>
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../index.html" aria-label="Volver al portal"><span class="b-ico">←</span></a>
    <span class="chip" id="chNivel"></span>
    <span class="chip" id="chOro"></span>
  </div>
  <div class="hud hud-der">
    <div class="barras">
      <div class="bv hp"><i id="fHp"></i><span id="tHp"></span></div>
      <div class="bv mp"><i id="fMp"></i><span id="tMp"></span></div>
      <div class="bv xp"><i id="fXp"></i><span id="tXp"></span></div>
    </div>
  </div>
  <div class="hud hud-abajo">
    <button class="b3d b-rojo" id="bVida" type="button" aria-label="Poción de vida (1)" title="Poción de vida (tecla 1)"><span class="b-ico">🧪</span><span class="b-info" id="nVida">×0</span></button>
    <button class="b3d b-azul" id="bMana" type="button" aria-label="Poción de maná (2)" title="Poción de maná (tecla 2)"><span class="b-ico">💧</span><span class="b-info" id="nMana">×0</span></button>
    <button class="b3d b-oro" id="bMagia" type="button" aria-label="Bola de fuego (Q)" title="Bola de fuego (Q o espacio)"><span class="b-ico">🔥</span></button>
    <button class="b3d b-morado" id="bDiario" type="button" aria-label="Diario de misiones (L)" title="Diario de misiones (L)"><span class="b-ico">📜</span></button>
  </div>
  <script type="module" src="juego-fate.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
