<!doctype html>
<!-- Ruta: zuma/index-zuma.html -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zuma</title>
  <meta name="theme-color" content="#1b2330" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <style>
    [hidden] { display: none !important; }
    body { background: #1a1d22; }
    .zona { max-width: 680px; margin: 0 auto; padding: 8px 8px 24px; }
    .marco { position: relative; width: 100%; max-width: 640px; margin: 0 auto; }
    #lienzo { margin: 0 auto; max-width: 640px; background: #3a4047; border-color: #5a626b; cursor: crosshair; }
    #velo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; background: rgba(12, 14, 18, .72); border-radius: 16px; }
    #veloTitulo { margin: 0; font-size: 1.6rem; }
    #veloTexto { margin: 0; color: var(--suave); max-width: 32ch; }
    #veloNiveles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 40%; overflow: auto; }
    .nv { padding: 8px 12px; font: inherit; font-weight: 700; color: var(--texto); background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 12px; cursor: pointer; }
    .nv.bloq { opacity: .4; cursor: default; }
    .nv:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    .btn.sec { background: rgba(10, 14, 50, .55); border: 1px solid var(--borde); color: inherit; }
    #barra2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 8px; }
    #monedas { font-weight: 800; margin-right: 6px; }
    #ayuda { margin: 8px 0 0; text-align: center; font-size: .8rem; color: var(--suave); }
  </style>
</head>
<body>
  <header class="barra">
    <div class="titulo" style="display:flex;align-items:center;gap:10px">
      <a class="btn" href="../" aria-label="Volver al portal">←</a>
      <h1>🐸 Zuma</h1>
    </div>
    <button class="btn" id="sonido" type="button" aria-label="Sonido">🔊</button>
  </header>
  <main class="zona">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="640" height="480" aria-label="Tablero de Zuma"></canvas>
      <div id="velo">
        <h2 id="veloTitulo"></h2>
        <p id="veloTexto"></p>
        <div id="veloNiveles" hidden></div>
        <button class="btn" id="veloBtn" type="button"></button>
        <button class="btn sec" id="veloBtn2" type="button" hidden></button>
      </div>
    </div>
    <div id="barra2">
      <span id="monedas">🪙 0</span>
      <button class="btn" id="bTiempo" type="button"></button>
      <button class="btn" id="bMetal" type="button"></button>
    </div>
    <p id="ayuda">Apunta y toca para disparar · toca la rana (o barra espaciadora) para cambiar de bola · cada boost cuesta 30 🪙 y se compra al usarlo</p>
  </main>
  <script type="module" src="juego-zuma.js"></script>
</body>
</html>
