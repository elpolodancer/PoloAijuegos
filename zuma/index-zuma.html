<!doctype html>
<!-- Ruta: zuma/index-zuma.html -->
<html lang="es" class="inmersivo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Zuma</title>
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="../compartido/estilos.css" />
  <link rel="stylesheet" href="../compartido/inmersivo.css" />
  <style>
    #lienzo { cursor: crosshair; }
    #velo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; background: rgba(12, 14, 18, .72); }
    #veloTitulo { margin: 0; font-size: 1.6rem; }
    #veloTexto { margin: 0; color: var(--suave); max-width: 32ch; }
    #veloNiveles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 40%; overflow: auto; touch-action: pan-y; }
    .nv { padding: 8px 12px; font: inherit; font-weight: 700; color: var(--texto); background: #2a2f38; border: 2px solid #4a515c; border-radius: 12px; cursor: pointer; }
    .nv.bloq { opacity: .4; cursor: default; }
    .nv:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    .btn.sec { background: rgba(60, 66, 76, .7); border: 1px solid #5a626b; color: inherit; }
  </style>
</head>
<body class="inmersivo" data-pantalla-auto="horizontal">
  <h1 class="solo-lector">Zuma</h1>
  <div class="escena">
    <div class="marco">
      <canvas id="lienzo" class="lienzo" width="640" height="480" aria-label="Tablero de Zuma"></canvas>
      <div id="velo">
        <h2 id="veloTitulo"></h2>
        <p id="veloTexto"></p>
        <div id="veloNiveles" hidden></div>
        <button class="btn" id="veloBtn" type="button"></button>
        <button class="btn sec" id="veloBtn2" type="button" hidden></button>
      </div>
    </div>
  </div>

  <!-- Botones flotantes -->
  <div class="hud hud-izq">
    <a class="b3d chico b-gris" href="../" aria-label="Volver al portal"><span class="b-ico">←</span></a>
    <span class="chip" id="monedas">🪙 0</span>
  </div>
  <div class="hud hud-der">
    <button class="b3d chico b-gris" id="sonido" type="button" aria-label="Sonido"><span class="b-ico">🔊</span></button>
  </div>
  <div class="hud hud-abajo">
    <button class="b3d b-azul"  id="bTiempo" type="button" aria-label="Detener tiempo"><span class="b-ico">⏳</span><span class="b-info"></span></button>
    <button class="b3d b-oro"   id="bMetal"  type="button" aria-label="4 bolas metálicas"><span class="b-ico">🔩</span><span class="b-info"></span></button>
  </div>
  <script type="module" src="juego-zuma.js"></script>
  <script type="module" src="../compartido/pantalla-completa.js"></script>
</body>
</html>
